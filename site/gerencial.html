<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Gestão — INK</title>
  <style>
    :root {
      --rosa:  #e91e8c;
      --preto: #0f0f0f;
      --bg:    #f0f2f5;
      --card:  #ffffff;
      --borda: #e2e8f0;
      --muted: #64748b;
      --r:     12px;
      --sh:    0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
      --sh-lg: 0 2px 8px rgba(0,0,0,.08), 0 8px 32px rgba(0,0,0,.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; background: var(--bg); color: var(--preto); font-size: 14px; line-height: 1.6; }

    /* HEADER */
    .header { background: var(--preto); color: #fff; border-bottom: 3px solid var(--rosa); position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 1140px; margin: 0 auto; padding: 0 32px; height: 64px; display: flex; align-items: center; gap: 16px; }
    .logo { font-size: 24px; font-weight: 900; letter-spacing: -1px; color: #fff; flex-shrink: 0; }
    .logo b { color: var(--rosa); }
    .sep { width: 1px; height: 26px; background: #2a2a2a; flex-shrink: 0; }
    .hdr-meta { flex: 1; }
    .hdr-meta h1 { font-size: 14px; font-weight: 700; }
    .hdr-meta p  { font-size: 11px; color: #666; margin-top: 1px; }
    .btn-back { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; background: #1a1a1a; color: #aaa; font-size: 12px; font-weight: 600; text-decoration: none; border: 1px solid #2a2a2a; flex-shrink: 0; transition: all .15s; }
    .btn-back:hover { background: var(--rosa); color: #fff; border-color: var(--rosa); }

    /* LAYOUT */
    .main { max-width: 1140px; margin: 0 auto; padding: 36px 32px 80px; }

    /* SKELETON */
    @keyframes shimmer { 0% { background-position:-700px 0 } 100% { background-position:700px 0 } }
    .sk { background: linear-gradient(90deg,#edf0f4 25%,#dde2e8 50%,#edf0f4 75%); background-size:700px 100%; animation:shimmer 1.4s ease-in-out infinite; border-radius:6px; display:block; }

    /* MÊS SELECTOR */
    .mes-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
    .mes-nav-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
    .mes-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--borda); background: var(--card); font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .15s; }
    .mes-btn:hover  { border-color: var(--rosa); color: var(--rosa); }
    .mes-btn.ativo  { background: var(--preto); border-color: var(--preto); color: #fff; }

    /* SEÇÃO */
    .section { margin-bottom: 32px; }
    .section-head { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 16px; }
    .section-head::before { content:""; display:block; width:3px; height:14px; background:var(--rosa); border-radius:2px; flex-shrink:0; }

    /* KPI CARDS */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-bottom: 32px; }
    .kpi { background: var(--card); border: 1px solid var(--borda); border-radius: var(--r); box-shadow: var(--sh); padding: 20px 22px; position: relative; overflow: hidden; }
    .kpi.destaque { border-left: 4px solid var(--rosa); }
    .kpi-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 10px; }
    .kpi-num   { font-size: 40px; font-weight: 900; letter-spacing: -2px; line-height: 1; }
    .kpi.destaque .kpi-num { color: var(--rosa); }
    .kpi-sub   { font-size: 11px; color: var(--muted); margin-top: 8px; font-weight: 600; }
    .kpi-sub.up   { color: #dc2626; }
    .kpi-sub.down { color: #16a34a; }
    .kpi-sub.flat { color: var(--muted); }

    /* DOIS PAINEIS LADO A LADO */
    .dois-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
    @media (max-width: 700px) { .dois-col { grid-template-columns: 1fr; } }
    .painel { background: var(--card); border: 1px solid var(--borda); border-radius: var(--r); box-shadow: var(--sh); padding: 22px 24px; }
    .painel-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
    .painel-title::before { content:""; width:3px; height:13px; background:var(--rosa); border-radius:2px; display:block; }

    /* RANKING AGENTES */
    .agente-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .agente-row:last-child { margin-bottom: 0; }
    .agente-pos  { font-size: 11px; font-weight: 800; color: var(--muted); width: 16px; text-align: right; flex-shrink: 0; }
    .agente-nome { font-size: 13px; font-weight: 700; min-width: 80px; flex-shrink: 0; }
    .agente-bar-wrap { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .agente-bar  { height: 100%; background: var(--rosa); border-radius: 4px; transition: width .4s ease; }
    .agente-num  { font-size: 12px; font-weight: 700; color: var(--preto); width: 28px; text-align: right; flex-shrink: 0; }

    /* TOP TAGS */
    .tag-row { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
    .tag-row:last-child { margin-bottom: 0; }
    .tag-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .tag-nome { font-size: 13px; font-weight: 600; flex: 1; }
    .tag-bar-wrap { width: 100px; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
    .tag-bar  { height: 100%; border-radius: 3px; }
    .tag-cnt  { font-size: 12px; font-weight: 700; color: var(--muted); width: 28px; text-align: right; flex-shrink: 0; }

    /* SEMANAS */
    .semanas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .semana-card { background: var(--card); border: 1px solid var(--borda); border-radius: var(--r); box-shadow: var(--sh); padding: 18px 20px; transition: box-shadow .15s, transform .15s; }
    .semana-card:hover { box-shadow: var(--sh-lg); transform: translateY(-1px); }
    .semana-card.atual { border-left: 4px solid var(--rosa); }
    .semana-range { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 10px; }
    .semana-total { font-size: 36px; font-weight: 900; letter-spacing: -1.5px; line-height: 1; margin-bottom: 6px; }
    .semana-vs    { font-size: 11px; font-weight: 700; margin-bottom: 12px; }
    .semana-vs.up   { color: #dc2626; }
    .semana-vs.down { color: #16a34a; }
    .semana-vs.flat { color: var(--muted); }
    .semana-detalhe { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; border-top: 1px solid var(--borda); padding-top: 10px; margin-top: 4px; }
    .semana-detalhe span b { color: var(--preto); font-weight: 600; }
    .semana-csat-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .semana-csat-item { font-size: 11px; color: var(--muted); background: #f8fafc; border: 1px solid var(--borda); border-radius: 6px; padding: 3px 8px; }
    .semana-csat-item b { color: var(--preto); font-weight: 700; }
    .semana-csat-item.pos { color: #16a34a; border-color: #bbf7d0; background: #f0fdf4; }
    .semana-csat-item.neg { color: var(--rosa); border-color: #fce7f3; background: #fdf2f8; }
    .section-head.pos::before { background: #16a34a; }
    .painel.pos .painel-title::before { background: #16a34a; }

    /* NOTAS REUNIÃO */
    .notas-card { background: var(--card); border: 1px solid var(--borda); border-radius: var(--r); box-shadow: var(--sh); overflow: hidden; }
    .notas-topo { padding: 16px 24px; background: var(--preto); display: flex; align-items: center; justify-content: space-between; }
    .notas-topo-title { font-size: 13px; font-weight: 800; color: #fff; }
    .notas-topo-sub { font-size: 11px; color: #888; margin-top: 2px; }
    .notas-saved-status { font-size: 11px; color: #4ade80; font-weight: 600; opacity: 0; transition: opacity .3s; }
    .notas-saved-status.visivel { opacity: 1; }
    .notas-body { padding: 22px 24px; }
    .notas-secao { margin-bottom: 24px; }
    .notas-secao:last-child { margin-bottom: 0; }
    .notas-secao-titulo { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin-bottom: 12px; }
    .notas-lista { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .notas-item { display: flex; align-items: center; gap: 8px; }
    .notas-bullet { color: var(--rosa); font-size: 18px; line-height: 1; flex-shrink: 0; margin-top: -2px; }
    .notas-input { flex: 1; border: none; border-bottom: 1px solid var(--borda); padding: 5px 0; font-size: 13px; font-family: inherit; color: var(--preto); background: transparent; outline: none; transition: border-color .15s; }
    .notas-input:focus { border-color: var(--rosa); }
    .notas-input::placeholder { color: #cbd5e1; }
    .notas-del { background: none; border: none; color: #cbd5e1; cursor: pointer; font-size: 16px; padding: 0 2px; line-height: 1; transition: color .15s; flex-shrink: 0; }
    .notas-del:hover { color: #dc2626; }
    .notas-add-btn { background: none; border: 1px dashed #cbd5e1; color: var(--muted); font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 6px; cursor: pointer; transition: all .15s; }
    .notas-add-btn:hover { border-color: var(--rosa); color: var(--rosa); }
    .notas-rodape { padding: 14px 24px; border-top: 1px solid var(--borda); display: flex; align-items: center; justify-content: space-between; background: #fafbfc; }
    .notas-rodape-hint { font-size: 11px; color: var(--muted); }
    .btn-copy-notas { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--borda); background: var(--card); color: var(--preto); font-size: 12px; font-weight: 700; cursor: pointer; transition: all .15s; }
    .btn-copy-notas:hover { background: var(--preto); color: #fff; border-color: var(--preto); }
    .btn-copy-notas.copiado { background: #f0fdf4; border-color: #16a34a; color: #16a34a; }
    .btn-sugerir { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 8px; border: 1.5px solid var(--rosa); background: #fff0f6; color: var(--rosa); font-size: 11px; font-weight: 700; cursor: pointer; transition: all .15s; }
    .btn-sugerir:hover { background: var(--rosa); color: #fff; }

    /* FOOTER */
    .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--borda); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
    .footer-brand { font-weight: 900; font-size: 14px; color: var(--preto); }
    .footer-brand b { color: var(--rosa); }
    .erro { padding: 40px; background: #fff3f3; border: 1px solid #ffd0d0; border-radius: var(--r); color: #c0392b; text-align: center; }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">INK<b>.</b></div>
    <div class="sep"></div>
    <div class="hdr-meta">
      <h1>Painel de Gestão — CSAT</h1>
      <p>Visão geral + monitoramento de positivos e negativos · Atualizado todo dia útil às 7h</p>
    </div>
    <a class="btn-back" href="/">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Voltar
    </a>
  </div>
</header>

<main class="main">
  <div id="conteudo">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px">
      ${[1,2,3,4].map(()=>`<div style="background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:20px 22px"><div class="sk" style="width:80px;height:10px;margin-bottom:14px"></div><div class="sk" style="width:55px;height:36px;margin-bottom:10px"></div><div class="sk" style="width:110px;height:10px"></div></div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px">
      <div style="background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:22px 24px;height:200px"><div class="sk" style="width:100px;height:11px;margin-bottom:18px"></div>${[1,2,3,4].map(()=>`<div class="sk" style="height:14px;margin-bottom:12px"></div>`).join('')}</div>
      <div style="background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:22px 24px;height:200px"><div class="sk" style="width:80px;height:11px;margin-bottom:18px"></div>${[1,2,3,4,5].map(()=>`<div class="sk" style="height:13px;margin-bottom:11px"></div>`).join('')}</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
      ${[1,2,3,4].map(()=>`<div style="background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:18px 20px"><div class="sk" style="width:70px;height:10px;margin-bottom:10px"></div><div class="sk" style="width:50px;height:32px;margin-bottom:10px"></div><div class="sk" style="width:90px;height:10px"></div></div>`).join('')}
    </div>
  </div>
  <div class="footer">
    <span class="footer-brand">INK<b>.</b></span>
    <span>Dados dos últimos 90 dias</span>
  </div>
</main>

<script>
  const API = 'https://csat-negativo-78f436cca6a0.herokuapp.com';
  const MESES_PT   = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const MESES_ABR  = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const TAG_COR    = { Entrega:'#1d4ed8', Financeiro:'#15803d', Troca:'#b45309', Produto:'#7e22ce', Cancelamento:'#c2410c', Atendimento:'#0369a1' };
  const TAG_CAT    = { entrega:'Entrega', atraso:'Entrega', rastreio:'Entrega', envio:'Entrega', extravio:'Entrega', financeiro:'Financeiro', estorno:'Financeiro', reembolso:'Financeiro', chargeback:'Financeiro', troca:'Troca', devoluc:'Troca', defeito:'Produto', cancelamento:'Cancelamento', atendimento:'Atendimento', demora:'Atendimento' };

  function tagCor(nome) {
    const n = (nome||'').toLowerCase().replace(/[_\s]/g,'');
    for (const [k,cat] of Object.entries(TAG_CAT)) { if (n.includes(k)) return TAG_COR[cat] || '#475569'; }
    return '#475569';
  }
  function formatTag(s) { return (s||'').replace(/_/g,' '); }
  function mesLabel(chave) {
    const [a,m] = chave.split('-').map(Number);
    return `${MESES_PT[m-1]} ${a}`;
  }
  function semanaLabel(monday) {
    const [a,m,d] = monday.split('-').map(Number);
    const fri = new Date(a, m-1, d+4);
    const dFri = fri.getDate(), mFri = fri.getMonth();
    if (mFri === m-1) return `${d}–${dFri} ${MESES_ABR[m-1]}`;
    return `${d} ${MESES_ABR[m-1]} – ${dFri} ${MESES_ABR[mFri]}`;
  }

  let dadosGestao = null;
  let mesAtivo = null;

  async function init() {
    try {
      const r = await fetch(`${API}/gestao`);
      if (!r.ok) throw new Error('Erro ao buscar dados');
      dadosGestao = await r.json();
      const mesesKeys = Object.keys(dadosGestao.meses).sort().reverse();
      mesAtivo = mesesKeys[0] || null;
      if (!mesAtivo) { document.getElementById('conteudo').innerHTML = '<div class="erro">Sem dados disponíveis ainda.</div>'; return; }
      render();
      carregarNotas();
      renderNotasLista('comportamentos');
      renderNotasLista('fluxos');
    } catch(e) {
      document.getElementById('conteudo').innerHTML = `<div class="erro">Erro ao carregar: ${e.message}</div>`;
    }
  }

  function render() {
    const { meses, semanas } = dadosGestao;
    const mesesKeys = Object.keys(meses).sort().reverse();
    const mesDados  = meses[mesAtivo] || { total:0, dias:0, por_agente:{}, tags:{} };

    // Mês anterior para comparação
    const [ma, mm] = mesAtivo.split('-').map(Number);
    const prevChave = mm === 1 ? `${ma-1}-12` : `${ma}-${String(mm-1).padStart(2,'0')}`;
    const mesAnterior = meses[prevChave];

    // ── Nav de meses ──
    const navHtml = mesesKeys.length > 1 ? `
      <div class="mes-nav">
        <span class="mes-nav-label">Mês</span>
        ${mesesKeys.map(k => `<button class="mes-btn${k===mesAtivo?' ativo':''}" onclick="selecionarMes('${k}')">${mesLabel(k)}</button>`).join('')}
      </div>` : '';

    // ── KPIs gerais ──
    const totalRecebidos = mesDados.total_recebidos || 0;
    const totalAvaliados = mesDados.total_avaliados || 0;
    const totalPositivos = mesDados.total_positivos || 0;
    const totalNegAll    = mesDados.total_negativos || mesDados.total;
    const taxaResposta   = totalRecebidos > 0 ? Math.round(totalAvaliados / totalRecebidos * 100) : null;
    const pctSatisfacao  = totalAvaliados > 0 ? Math.round(totalPositivos / totalAvaliados * 100) : null;
    const media = mesDados.dias ? (mesDados.total / mesDados.dias).toFixed(1) : '0';

    let vsHtml = '<span class="kpi-sub flat">sem mês anterior</span>';
    if (mesAnterior && mesAnterior.total > 0) {
      const diff = mesDados.total - mesAnterior.total;
      const pct  = Math.round(Math.abs(diff) / mesAnterior.total * 100);
      if (diff > 0)      vsHtml = `<span class="kpi-sub up">↑ +${pct}% vs. ${MESES_ABR[mm-2>=0?mm-2:11]}</span>`;
      else if (diff < 0) vsHtml = `<span class="kpi-sub down">↓ −${pct}% vs. ${MESES_ABR[mm-2>=0?mm-2:11]}</span>`;
      else               vsHtml = `<span class="kpi-sub flat">→ igual ao mês anterior</span>`;
    }

    // ── Ranking de satisfação por agente ──
    const possPorAg = mesDados.por_agente_positivos || {};
    const negsPorAg = mesDados.por_agente || {};
    const todosAgentes = [...new Set([...Object.keys(possPorAg), ...Object.keys(negsPorAg)])];
    const satisfSorted = todosAgentes.map(ag => {
      const pos = possPorAg[ag] || 0;
      const neg = negsPorAg[ag] || 0;
      const tot = pos + neg;
      return { nome: ag, pos, neg, tot, pct: tot > 0 ? Math.round(pos / tot * 100) : 0 };
    }).sort((a, b) => b.pct - a.pct);

    const satisfacaoHtml = satisfSorted.length ? satisfSorted.map(d => {
      const cor = d.pct >= 75 ? '#16a34a' : d.pct >= 50 ? '#ca8a04' : '#dc2626';
      return `<div class="agente-row">
        <span class="agente-pos" style="color:${cor};width:36px;font-size:12px">${d.pct}%</span>
        <span class="agente-nome">${d.nome.split(' ')[0]}</span>
        <div class="agente-bar-wrap"><div class="agente-bar" style="width:${d.pct}%;background:${cor}"></div></div>
        <span class="agente-num" style="font-size:11px;color:var(--muted);width:56px">${d.pos}↑ ${d.neg}↓</span>
      </div>`;
    }).join('') : '<p style="color:var(--muted);font-size:12px">Sem dados — reprocesse os dias do mês</p>';

    // ── Ranking negativos por agente ──
    const agentes = Object.entries(mesDados.por_agente).sort((a,b) => b[1]-a[1]);
    const maxAg = agentes[0]?.[1] || 1;
    const rankingHtml = agentes.length ? agentes.map(([nome,cnt], i) => `
      <div class="agente-row">
        <span class="agente-pos">${i+1}</span>
        <span class="agente-nome">${nome.split(' ')[0]}</span>
        <div class="agente-bar-wrap"><div class="agente-bar" style="width:${Math.round(cnt/maxAg*100)}%"></div></div>
        <span class="agente-num">${cnt}</span>
      </div>`).join('') : '<p style="color:var(--muted);font-size:12px">Sem dados</p>';

    // ── Top tags ──
    const topTags = Object.entries(mesDados.tags).sort((a,b) => b[1]-a[1]).slice(0,6);
    const maxTag  = topTags[0]?.[1] || 1;
    const tagsHtml = topTags.length ? topTags.map(([tag,cnt]) => {
      const cor = tagCor(tag);
      return `<div class="tag-row">
        <span class="tag-dot" style="background:${cor}"></span>
        <span class="tag-nome">${formatTag(tag)}</span>
        <div class="tag-bar-wrap"><div class="tag-bar" style="width:${Math.round(cnt/maxTag*100)}%;background:${cor}"></div></div>
        <span class="tag-cnt">${cnt}</span>
      </div>`;
    }).join('') : '<p style="color:var(--muted);font-size:12px">Sem tags</p>';

    // ── Positivos por agente ──
    const posAgentes = Object.entries(mesDados.por_agente_positivos || {}).sort((a,b) => b[1]-a[1]);
    const maxPosAg   = posAgentes[0]?.[1] || 1;
    const posRankingHtml = posAgentes.length ? posAgentes.map(([nome,cnt], i) => `
      <div class="agente-row">
        <span class="agente-pos">${i+1}</span>
        <span class="agente-nome">${nome.split(' ')[0]}</span>
        <div class="agente-bar-wrap"><div class="agente-bar" style="width:${Math.round(cnt/maxPosAg*100)}%;background:#16a34a"></div></div>
        <span class="agente-num">${cnt}</span>
      </div>`).join('') : '<p style="color:var(--muted);font-size:12px">Sem dados</p>';

    // ── Top tags positivos ──
    const topTagsPos = Object.entries(mesDados.tags_positivos || {}).sort((a,b) => b[1]-a[1]).slice(0,6);
    const maxTagPos  = topTagsPos[0]?.[1] || 1;
    const tagsPositivosHtml = topTagsPos.length ? topTagsPos.map(([tag,cnt]) => `
      <div class="tag-row">
        <span class="tag-dot" style="background:#16a34a"></span>
        <span class="tag-nome">${formatTag(tag)}</span>
        <div class="tag-bar-wrap"><div class="tag-bar" style="width:${Math.round(cnt/maxTagPos*100)}%;background:#16a34a"></div></div>
        <span class="tag-cnt">${cnt}</span>
      </div>`).join('') : '<p style="color:var(--muted);font-size:12px">Sem tags</p>';

    // ── Semanas (últimas 8 em ordem cronológica, mais antiga → mais recente) ──
    const semanasKeys = Object.keys(semanas).sort().slice(-8);
    const last = semanasKeys.length - 1;
    const semanasHtml = semanasKeys.map((mon, i) => {
      const s = semanas[mon];
      const anterior = semanas[semanasKeys[i-1]];
      let vsEl = '';
      if (anterior && anterior.total > 0) {
        const diff = s.total - anterior.total;
        const pct  = Math.round(Math.abs(diff) / anterior.total * 100);
        if (diff > 0)      vsEl = `<div class="semana-vs up">↑ +${pct}% vs. anterior</div>`;
        else if (diff < 0) vsEl = `<div class="semana-vs down">↓ −${pct}% vs. anterior</div>`;
        else               vsEl = `<div class="semana-vs flat">→ igual à anterior</div>`;
      }
      const topAg = Object.entries(s.por_agente).sort((a,b)=>b[1]-a[1])[0];
      const piorFmt = s.pior_dia ? `${Number(s.pior_dia.slice(8))}/${MESES_ABR[Number(s.pior_dia.slice(5,7))-1]}` : '—';
      return `
        <div class="semana-card${i===last?' atual':''}">
          <div class="semana-range">${semanaLabel(mon)}</div>
          <div class="semana-total">${s.total}</div>
          ${vsEl || '<div style="margin-bottom:12px"></div>'}
          <div class="semana-detalhe">
            <span>Pior dia <b>${piorFmt} (${s.pior_total})</b></span>
            <span>${s.dias} dia${s.dias!==1?'s':''} ${s.dias!==1?'úteis':'útil'}</span>
          </div>
          ${s.total_avaliados ? `<div class="semana-csat-row">
            <span class="semana-csat-item">Recebidos <b>${s.total_recebidos || s.total_avaliados}</b></span>
            <span class="semana-csat-item">Avaliados <b>${s.total_avaliados}</b></span>
            <span class="semana-csat-item pos">✓ ${s.total_positivos || 0}</span>
            <span class="semana-csat-item neg">✗ ${s.total}</span>
          </div>` : ''}
        </div>`;
    }).join('');

    document.getElementById('conteudo').innerHTML = `
      ${navHtml}

      <div class="section-head">Visão geral — ${mesLabel(mesAtivo)}</div>
      <div class="kpi-grid">
        <div class="kpi destaque">
          <div class="kpi-label">% Satisfação</div>
          <div class="kpi-num">${pctSatisfacao !== null ? pctSatisfacao + '%' : '—'}</div>
          <div class="kpi-sub flat">${totalPositivos} pos · ${totalNegAll} neg</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Avaliações recebidas</div>
          <div class="kpi-num">${totalRecebidos || '—'}</div>
          <div class="kpi-sub flat">tickets com CSAT enviado</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Taxa de resposta</div>
          <div class="kpi-num">${taxaResposta !== null ? taxaResposta + '%' : '—'}</div>
          <div class="kpi-sub flat">${totalAvaliados} avaliaram</div>
        </div>
        <div class="kpi" style="border-left:4px solid #16a34a">
          <div class="kpi-label">Positivos no mês</div>
          <div class="kpi-num" style="color:#16a34a">${totalPositivos || '—'}</div>
          <div class="kpi-sub flat">avaliações positivas</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Negativos no mês</div>
          <div class="kpi-num">${totalNegAll || mesDados.total}</div>
          ${vsHtml}
        </div>
      </div>

      <div class="painel" style="margin-bottom:32px">
        <div class="painel-title">Satisfação por agente — ${mesLabel(mesAtivo)}</div>
        ${satisfacaoHtml}
      </div>

      <div class="section-head pos">Monitoramento de positivos</div>
      <div class="dois-col">
        <div class="painel pos">
          <div class="painel-title">Positivos por agente</div>
          ${posRankingHtml}
        </div>
        <div class="painel pos">
          <div class="painel-title">Top tags — positivos</div>
          ${tagsPositivosHtml}
        </div>
      </div>

      <div class="section-head">Monitoramento de negativos</div>
      <div class="dois-col">
        <div class="painel">
          <div class="painel-title">Negativos por agente</div>
          ${rankingHtml}
        </div>
        <div class="painel">
          <div class="painel-title">Top tags — negativos</div>
          ${tagsHtml}
        </div>
      </div>

      <div class="section">
        <div class="section-head">Semanas recentes</div>
        <div class="semanas-grid">${semanasHtml || '<p style="color:var(--muted)">Sem dados semanais</p>'}</div>
      </div>

      <div class="section">
        <div class="section-head">Notas para reunião de segunda</div>
        <div class="notas-card">
          <div class="notas-topo">
            <div>
              <div class="notas-topo-title">Preparação semanal</div>
              <div class="notas-topo-sub">Semana ${semanaLabel(getMondayThisWeek())} · salvo no navegador</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px">
              <button class="btn-sugerir" onclick="gerarSugestoes()" title="Preenche os bullets com base nos dados da semana">✦ Sugerir com dados</button>
              <span class="notas-saved-status" id="notas-saved">salvo ✓</span>
            </div>
          </div>
          <div class="notas-body">
            <div class="notas-secao">
              <div class="notas-secao-titulo">📌 Comportamentos a reforçar ou corrigir</div>
              <ul class="notas-lista" id="lista-comportamentos"></ul>
              <button class="notas-add-btn" onclick="addBullet('comportamentos')">+ Adicionar</button>
            </div>
            <div class="notas-secao" style="margin-top:22px">
              <div class="notas-secao-titulo">💬 Feedback sobre fluxos, macros e ferramentas</div>
              <ul class="notas-lista" id="lista-fluxos"></ul>
              <button class="notas-add-btn" onclick="addBullet('fluxos')">+ Adicionar</button>
            </div>
          </div>
          <div class="notas-rodape">
            <span class="notas-rodape-hint">As notas ficam salvas até você limpar o navegador</span>
            <button class="btn-copy-notas" id="btn-copy-notas" onclick="copiarParaReuniao()">Copiar para reunião</button>
          </div>
        </div>
      </div>`;
  }

  function selecionarMes(chave) {
    mesAtivo = chave;
    render();
    carregarNotas();
    renderNotasLista('comportamentos');
    renderNotasLista('fluxos');
  }

  /* ── NOTAS ──────────────────────────────────────────── */
  function getMondayThisWeek() {
    const today = new Date();
    const dow = today.getDay();
    const offset = dow === 0 ? 6 : dow - 1;
    const mon = new Date(today);
    mon.setDate(today.getDate() - offset);
    return mon.toISOString().slice(0, 10);
  }

  const NOTAS_KEY = `csat-notas-${getMondayThisWeek()}`;
  let notas = { comportamentos: [], fluxos: [] };

  function carregarNotas() {
    try { notas = JSON.parse(localStorage.getItem(NOTAS_KEY) || '{"comportamentos":[],"fluxos":[]}'); }
    catch(e) { notas = { comportamentos: [], fluxos: [] }; }
  }

  function salvarNotas() {
    localStorage.setItem(NOTAS_KEY, JSON.stringify(notas));
    const el = document.getElementById('notas-saved');
    if (el) { el.classList.add('visivel'); setTimeout(() => el.classList.remove('visivel'), 1500); }
  }

  function renderNotasLista(tipo) {
    const el = document.getElementById('lista-' + tipo);
    if (!el) return;
    el.innerHTML = (notas[tipo] || []).map((txt, i) => `
      <li class="notas-item">
        <span class="notas-bullet">·</span>
        <input class="notas-input" value="${txt.replace(/"/g,'&quot;').replace(/</g,'&lt;')}" placeholder="Escreva aqui..." oninput="updateBullet('${tipo}',${i},this.value)" />
        <button class="notas-del" onclick="removeBullet('${tipo}',${i})" title="Remover">×</button>
      </li>`).join('');
  }

  function addBullet(tipo) {
    notas[tipo].push('');
    salvarNotas();
    renderNotasLista(tipo);
    const lista = document.getElementById('lista-' + tipo);
    if (lista) { const inputs = lista.querySelectorAll('.notas-input'); if (inputs.length) inputs[inputs.length-1].focus(); }
  }

  function removeBullet(tipo, index) {
    notas[tipo].splice(index, 1);
    salvarNotas();
    renderNotasLista(tipo);
  }

  function updateBullet(tipo, index, value) {
    notas[tipo][index] = value;
    salvarNotas();
  }

  function gerarSugestoes() {
    if (!dadosGestao) return;
    const { semanas, meses } = dadosGestao;
    const semanasKeys = Object.keys(semanas).sort();
    const ultimas = semanasKeys.slice(-3);

    /* tendência por agente nas últimas 2 semanas */
    const comportamentos = [];

    if (ultimas.length >= 2) {
      const penultima = semanas[ultimas[ultimas.length - 2]]?.por_agente || {};
      const ultima    = semanas[ultimas[ultimas.length - 1]]?.por_agente || {};
      const agentes   = [...new Set([...Object.keys(penultima), ...Object.keys(ultima)])];

      agentes.forEach(ag => {
        const ant = penultima[ag] || 0;
        const atu = ultima[ag]    || 0;
        if (ant === 0 && atu === 0) return;
        const nome = ag.split(' ')[0]; // primeiro nome

        if (atu < ant && ant >= 5) {
          comportamentos.push(`${nome} caiu de ${ant} para ${atu} negativos na última semana — entender o que mudou e reforçar`);
        } else if (atu > ant && ant >= 3) {
          comportamentos.push(`${nome} subiu de ${ant} para ${atu} — conversar o que está travando`);
        } else if (atu >= 7) {
          comportamentos.push(`${nome} segue com volume alto (${atu} negativos na semana) — acompanhar de perto`);
        }
      });
    }

    /* tags de comportamento (acareação, no_tag) */
    const mesDados = meses[mesAtivo] || {};
    const tags = mesDados.tags || {};

    if ((tags['acareacao_nao_necessaria'] || 0) >= 3)
      comportamentos.push(`Acareação não necessária aparece ${tags['acareacao_nao_necessaria']}x no mês — alinhar com o time quando deve e quando não deve abrir`);
    if ((tags['no_tag'] || 0) >= 3)
      comportamentos.push(`${tags['no_tag']} tickets sem tag no mês — reforçar que tagear é obrigatório em todo atendimento`);

    /* fluxos: agrupa por categoria */
    const fluxos = [];

    const entregaTags = ['entrega_cep_incorreto','entrega_prazo','entrega_duvidas_problemas_2','entrega_duvidas_frete','pedido_parado_rastreio','rastreio_acao_remetente','problema_expedicao_pedido'];
    const totalEntrega = entregaTags.reduce((s, t) => s + (tags[t] || 0), 0);
    if (totalEntrega >= 5) {
      const detalhes = entregaTags.filter(t => tags[t]).map(t => {
        const label = t.replace('entrega_','').replace(/_/g,' ');
        return `${label} (${tags[t]})`;
      }).join(', ');
      fluxos.push(`Entrega é o maior bloco de negativos: ${detalhes} — verificar se há macro clara para orientar o cliente antes de virar CSAT`);
    }

    const cadastroTags = ['cadastro_alteracao_dados','cadastro_alteracao_titularidade'];
    const totalCadastro = cadastroTags.reduce((s, t) => s + (tags[t] || 0), 0);
    if (totalCadastro >= 4)
      fluxos.push(`Cadastro acumulou ${totalCadastro} negativos (alteração de dados + titularidade) — checar se a macro está resolvendo ou só respondendo`);

    const trocaTags = ['troca_duvida_fluxo_trocas','troca_suporte_seller','troca_defeito_erro'];
    const totalTroca = trocaTags.reduce((s, t) => s + (tags[t] || 0), 0);
    if (totalTroca >= 4)
      fluxos.push(`Troca somou ${totalTroca} negativos (fluxo, suporte seller, defeito) — fluxo de trocas está claro para as agentes?`);

    const assinaturaTags = ['assinatura_erro_cobranca','assinatura_planos','assinatura_cancelamento','assinatura_dados_cadastro_negado_pendencia'];
    const totalAssinatura = assinaturaTags.reduce((s, t) => s + (tags[t] || 0), 0);
    if (totalAssinatura >= 3)
      fluxos.push(`Assinatura com ${totalAssinatura} negativos — revisar macro e fluxo de tratamento`);

    /* merge com notas existentes, evitando duplicar */
    const jaExiste = (lista, texto) => lista.some(l => l.trim() === texto.trim());
    comportamentos.forEach(b => { if (!jaExiste(notas.comportamentos, b)) notas.comportamentos.push(b); });
    fluxos.forEach(b => { if (!jaExiste(notas.fluxos, b)) notas.fluxos.push(b); });

    salvarNotas();
    renderNotasLista('comportamentos');
    renderNotasLista('fluxos');
  }

  function copiarParaReuniao() {
    const comp   = (notas.comportamentos || []).filter(s => s.trim());
    const fluxos = (notas.fluxos || []).filter(s => s.trim());
    const linhas = [];
    if (comp.length)   { linhas.push('Comportamentos a reforçar ou corrigir'); comp.forEach(s => linhas.push(s));   linhas.push(''); }
    if (fluxos.length) { linhas.push('Feedback do time sobre fluxos, macros e ferramentas'); fluxos.forEach(s => linhas.push(s)); }
    navigator.clipboard.writeText(linhas.join('\n')).then(() => {
      const btn = document.getElementById('btn-copy-notas');
      if (!btn) return;
      const orig = btn.textContent;
      btn.textContent = '✓ Copiado!';
      btn.classList.add('copiado');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copiado'); }, 2000);
    });
  }

  init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatório CSAT — INK</title>
  <style>
    :root {
      --rosa:      #e91e8c;
      --rosa-s:    rgba(233,30,140,.08);
      --rosa-h:    rgba(233,30,140,.18);
      --preto:     #0f0f0f;
      --bg:        #f0f2f5;
      --card:      #ffffff;
      --borda:     #e2e8f0;
      --muted:     #64748b;
      --r:         12px;
      --sh:        0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
      --sh-lg:     0 2px 8px rgba(0,0,0,.08), 0 8px 32px rgba(0,0,0,.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--preto); font-size: 14px; line-height: 1.6; }

    /* HEADER */
    .header { background: var(--preto); color: #fff; border-bottom: 3px solid var(--rosa); position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 1140px; margin: 0 auto; padding: 0 32px; height: 64px; display: flex; align-items: center; gap: 16px; }
    .logo { font-size: 24px; font-weight: 900; letter-spacing: -1px; color: #fff; flex-shrink: 0; }
    .logo b { color: var(--rosa); }
    .sep { width: 1px; height: 26px; background: #2a2a2a; flex-shrink: 0; }
    .hdr-meta { flex: 1; min-width: 0; }
    .hdr-meta h1 { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hdr-meta p  { font-size: 11px; color: #666; margin-top: 1px; }
    .btn-back {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
      border-radius: 8px; background: #1a1a1a; color: #aaa; font-size: 12px; font-weight: 600;
      text-decoration: none; border: 1px solid #2a2a2a; flex-shrink: 0; transition: all .15s;
    }
    .btn-back:hover { background: var(--rosa); color: #fff; border-color: var(--rosa); }
    .btn-back svg { flex-shrink: 0; }

    /* LAYOUT */
    .main { max-width: 1140px; margin: 0 auto; padding: 36px 32px 80px; }

    /* ESTADOS */
    .loading { text-align: center; padding: 80px 0; color: var(--muted); }
    .loading-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--rosa); margin: 0 3px; animation: bounce .9s infinite; }
    .loading-dot:nth-child(2) { animation-delay: .15s; }
    .loading-dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }
    .erro { padding: 40px; background: #fff3f3; border: 1px solid #ffd0d0; border-radius: var(--r); color: #c0392b; text-align: center; }

    /* DATE HERO */
    .date-hero {
      background: var(--card); border: 1px solid var(--borda); border-radius: var(--r);
      box-shadow: var(--sh); padding: 24px 28px; margin-bottom: 24px;
      display: flex; align-items: center; gap: 20px;
    }
    .date-pill {
      background: var(--preto); color: #fff; font-size: 10px; font-weight: 800;
      letter-spacing: 1px; text-transform: uppercase; padding: 5px 12px; border-radius: 20px; flex-shrink: 0;
    }
    .date-info .dia { font-size: 22px; font-weight: 800; letter-spacing: -.4px; }
    .date-info .iso { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* KPI GRID */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .kpi {
      background: var(--card); border: 1px solid var(--borda); border-radius: var(--r);
      box-shadow: var(--sh); padding: 20px 22px; position: relative; overflow: hidden;
    }
    .kpi.total { border-left: 4px solid var(--rosa); }
    .kpi-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 10px; }
    .kpi-num { font-size: 40px; font-weight: 900; letter-spacing: -2px; line-height: 1; color: var(--preto); }
    .kpi.total .kpi-num { color: var(--rosa); }
    .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .kpi-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--rosa), transparent); border-radius: 0 2px 0 0; }

    /* SEÇÕES */
    .section { margin-bottom: 28px; }
    .section-head {
      display: flex; align-items: center; gap: 10px;
      font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px;
      color: var(--muted); margin-bottom: 14px;
    }
    .section-head::before {
      content: ""; display: block; width: 3px; height: 14px;
      background: var(--rosa); border-radius: 2px; flex-shrink: 0;
    }

    /* AGENTES */
    .agentes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
    .agente-card {
      background: var(--card); border: 1px solid var(--borda); border-radius: var(--r);
      box-shadow: var(--sh); padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      transition: box-shadow .15s, transform .15s;
    }
    .agente-card:hover { box-shadow: var(--sh-lg); transform: translateY(-1px); }
    .agente-nome { font-weight: 700; font-size: 14px; }
    .agente-sub  { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .agente-num  { font-size: 28px; font-weight: 900; color: var(--rosa); min-width: 36px; text-align: right; }

    /* TAGS RESUMO */
    .tags-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag-item {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--borda);
      border-radius: 8px; padding: 6px 12px; box-shadow: var(--sh);
      font-size: 12px; transition: box-shadow .15s;
    }
    .tag-item:hover { box-shadow: var(--sh-lg); }
    .tag-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .tag-nome { font-weight: 600; color: var(--preto); }
    .tag-count { font-size: 11px; font-weight: 700; color: var(--muted); background: var(--bg); padding: 1px 7px; border-radius: 10px; }

    /* LISTA DE TICKETS — painel de qualidade */
    .ticket-list { display: flex; flex-direction: column; gap: 10px; }

    .ticket-card {
      background: var(--card); border: 1px solid var(--borda); border-radius: var(--r);
      box-shadow: var(--sh); padding: 18px 22px;
      display: grid; grid-template-columns: 72px 1fr auto;
      align-items: center; gap: 20px;
      transition: box-shadow .15s, transform .15s;
    }
    .ticket-card:hover { box-shadow: var(--sh-lg); transform: translateY(-1px); }

    /* Bloco CSAT — elemento visual principal */
    .csat-bloco {
      width: 64px; height: 64px; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex-shrink: 0; gap: 3px;
    }
    .csat-bloco.n1 { background: #fef2f2; border: 1.5px solid #fecaca; }
    .csat-bloco.n2 { background: #fffbeb; border: 1.5px solid #fde68a; }
    .csat-bloco.n3 { background: #fefce8; border: 1.5px solid #fef08a; }
    .csat-num {
      font-size: 26px; font-weight: 900; letter-spacing: -1px; line-height: 1;
    }
    .n1 .csat-num { color: #b91c1c; }
    .n2 .csat-num { color: #b45309; }
    .n3 .csat-num { color: #92400e; }
    .csat-label {
      font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; opacity: .55;
    }
    .n1 .csat-label { color: #b91c1c; }
    .n2 .csat-label { color: #b45309; }
    .n3 .csat-label { color: #92400e; }

    /* Corpo central — agente + ID */
    .ticket-corpo { min-width: 0; }
    .ticket-agente { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
    .ticket-id-link {
      display: inline-flex; align-items: center; gap: 4px;
      font-family: monospace; font-size: 11px; color: var(--muted);
      text-decoration: none; opacity: .65; transition: opacity .15s;
    }
    .ticket-id-link:hover { opacity: 1; color: var(--rosa); }
    .ticket-id-link svg { flex-shrink: 0; }

    /* Tags — coluna direita, hierarquia reduzida */
    .ticket-tags { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 220px; flex-wrap: wrap; }
    .tag-chip {
      display: inline-block; padding: 2px 8px; border-radius: 5px;
      font-size: 10px; font-weight: 500; color: var(--muted);
      background: var(--bg); border: 1px solid var(--borda); opacity: .8;
      white-space: nowrap;
    }

    /* FOOTER */
    .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--borda); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .footer-brand { font-weight: 900; font-size: 14px; color: var(--preto); }
    .footer-brand b { color: var(--rosa); }

    /* VAZIO */
    .empty { padding: 40px; text-align: center; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">INK<b>.</b></div>
    <div class="sep"></div>
    <div class="hdr-meta">
      <h1>Relatório CSAT — Avaliações Negativas</h1>
      <p>Notas 1, 2 e 3 · Agentes monitoradas</p>
    </div>
    <a class="btn-back" href="/">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Voltar
    </a>
  </div>
</header>

<main class="main">
  <div id="conteudo">
    <div class="loading">
      <div style="margin-bottom:12px">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      </div>
      Carregando relatório...
    </div>
  </div>

  <div class="footer">
    <span class="footer-brand">INK<b>.</b></span>
    <span>Atualizado automaticamente todo dia útil às 7h</span>
  </div>
</main>

<script>
  const API = 'https://csat-negativo-78f436cca6a0.herokuapp.com';

  const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const SEMANA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

  // Cores por categoria de tag (primeiro segmento antes do _)
  const TAG_CORES = {
    entrega:      { bg: '#eff6ff', txt: '#1d4ed8', borda: '#bfdbfe' },
    troca:        { bg: '#fffbeb', txt: '#b45309', borda: '#fde68a' },
    financeiro:   { bg: '#f0fdf4', txt: '#15803d', borda: '#bbf7d0' },
    rastreio:     { bg: '#f5f3ff', txt: '#6d28d9', borda: '#ddd6fe' },
    devolucao:    { bg: '#fef2f2', txt: '#b91c1c', borda: '#fecaca' },
    cancelamento: { bg: '#fff7ed', txt: '#c2410c', borda: '#fed7aa' },
    defeito:      { bg: '#fdf4ff', txt: '#7e22ce', borda: '#e9d5ff' },
    default:      { bg: '#f8fafc', txt: '#475569', borda: '#e2e8f0' },
  };

  function tagCor(nome) {
    const cat = (nome || '').split('_')[0].toLowerCase();
    return TAG_CORES[cat] || TAG_CORES.default;
  }

  function formatTag(nome) {
    return (nome || '').replace(/_/g, ' ');
  }

  function formatarData(s) {
    const [ano, mes, dia] = s.split('-').map(Number);
    const d = new Date(ano, mes - 1, dia);
    return `${SEMANA[d.getDay()]}, ${dia} de ${MESES[mes - 1]} de ${ano}`;
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const date = params.get('date');
    const el = document.getElementById('conteudo');

    if (!date) {
      el.innerHTML = `<div class="erro">Data não informada. Use o calendário.</div>`;
      return;
    }

    document.title = `CSAT ${date} — INK`;

    try {
      const resp = await fetch(`${API}/data/${date}`);
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        el.innerHTML = `<div class="erro">Relatório não encontrado para <strong>${date}</strong>.<br>${err.error || ''}</div>`;
        return;
      }
      render(await resp.json(), el);
    } catch(e) {
      el.innerHTML = `<div class="erro">Erro ao carregar: ${e.message}</div>`;
    }
  }

  function render(d, el) {
    const { date, total = 0, por_agente = {}, tags_resumo = {}, tickets = [] } = d;
    const agentes = Object.entries(por_agente).sort((a,b) => b[1] - a[1]);
    const tags    = Object.entries(tags_resumo).sort((a,b) => b[1] - a[1]);
    const maxAgente = agentes[0]?.[1] || 1;

    // KPIs
    let kpis = `
      <div class="kpi total">
        <div class="kpi-label">Total negativo no dia</div>
        <div class="kpi-num">${total}</div>
        <div class="kpi-sub">Notas 1, 2 e 3</div>
      </div>`;
    for (const [nome, qtd] of agentes) {
      const pct = Math.round((qtd / maxAgente) * 100);
      kpis += `
        <div class="kpi">
          <div class="kpi-label">${nome.split(' ')[0]}</div>
          <div class="kpi-num">${qtd}</div>
          <div class="kpi-sub">${qtd === 1 ? 'avaliação negativa' : 'avaliações negativas'}</div>
          <div class="kpi-bar" style="width:${pct}%"></div>
        </div>`;
    }

    // Agentes
    let agentesHtml = agentes.map(([nome, qtd]) => `
      <div class="agente-card">
        <div>
          <div class="agente-nome">${nome}</div>
          <div class="agente-sub">${qtd === 1 ? 'avaliação negativa' : 'avaliações negativas'} no dia</div>
        </div>
        <div class="agente-num">${qtd}</div>
      </div>`).join('');

    // Tags resumo
    let tagsHtml = '';
    if (tags.length > 0) {
      tagsHtml = `
        <div class="section">
          <div class="section-head">Tags do dia</div>
          <div class="tags-grid">
            ${tags.map(([tag, cnt]) => {
              const c = tagCor(tag);
              return `<div class="tag-item">
                <div class="tag-dot" style="background:${c.txt}"></div>
                <span class="tag-nome">${formatTag(tag)}</span>
                <span class="tag-count">${cnt}</span>
              </div>`;
            }).join('')}
          </div>
        </div>`;
    }

    // Cards de tickets
    const linhas = tickets.map(t => {
      const nc = `n${t.nota}`;
      const idHtml = t.link
        ? `<a class="ticket-id-link" href="${t.link}" target="_blank" rel="noopener">
            #${t.id}
            <svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
           </a>`
        : `<span class="ticket-id-link" style="cursor:default">#${t.id || '—'}</span>`;

      const tagsHtml = (t.tags || []).map(tag =>
        `<span class="tag-chip">${formatTag(tag)}</span>`
      ).join('');

      return `
        <div class="ticket-card">
          <div class="csat-bloco ${nc}">
            <span class="csat-num">${t.nota}</span>
            <span class="csat-label">CSAT</span>
          </div>
          <div class="ticket-corpo">
            <div class="ticket-agente">${t.agente || '—'}</div>
            ${idHtml}
          </div>
          <div class="ticket-tags">${tagsHtml}</div>
        </div>`;
    }).join('');

    el.innerHTML = `
      <div class="date-hero">
        <div class="date-pill">Relatório do dia</div>
        <div class="date-info">
          <div class="dia">${formatarData(date)}</div>
          <div class="iso">${date}</div>
        </div>
      </div>

      <div class="kpi-grid">${kpis}</div>

      ${agentes.length > 0 ? `
        <div class="section">
          <div class="section-head">Detalhamento por agente</div>
          <div class="agentes-grid">${agentesHtml}</div>
        </div>` : ''}

      ${tagsHtml}

      <div class="section">
        <div class="section-head">Tickets avaliados</div>
        ${tickets.length > 0
          ? `<div class="ticket-list">${linhas}</div>`
          : '<div class="empty">Nenhum ticket registrado neste dia.</div>'}
      </div>`;
  }

  init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatório CSAT — INK</title>
  <style>
    :root {
      --rosa:      #e91e8c;
      --rosa-s:    rgba(233,30,140,.08);
      --preto:     #0f0f0f;
      --bg:        #f0f2f5;
      --card:      #ffffff;
      --borda:     #e2e8f0;
      --muted:     #64748b;
      --r:         12px;
      --sh:        0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
      --sh-lg:     0 2px 8px rgba(0,0,0,.08), 0 8px 32px rgba(0,0,0,.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--preto); font-size: 14px; line-height: 1.6; }

    /* ── HEADER ─────────────────────────────────────────── */
    .header { background: var(--preto); color: #fff; border-bottom: 3px solid var(--rosa); position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 1140px; margin: 0 auto; padding: 0 32px; height: 64px; display: flex; align-items: center; gap: 16px; }
    .logo { font-size: 24px; font-weight: 900; letter-spacing: -1px; color: #fff; flex-shrink: 0; }
    .logo b { color: var(--rosa); }
    .sep { width: 1px; height: 26px; background: #2a2a2a; flex-shrink: 0; }
    .hdr-meta { flex: 1; min-width: 0; }
    .hdr-meta h1 { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hdr-meta p  { font-size: 11px; color: #666; margin-top: 1px; }
    .btn-back { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; background: #1a1a1a; color: #aaa; font-size: 12px; font-weight: 600; text-decoration: none; border: 1px solid #2a2a2a; flex-shrink: 0; transition: all .15s; }
    .btn-back:hover { background: var(--rosa); color: #fff; border-color: var(--rosa); }

    /* ── LAYOUT ─────────────────────────────────────────── */
    .main { max-width: 1140px; margin: 0 auto; padding: 36px 32px 80px; }
    .erro { padding: 40px; background: #fff3f3; border: 1px solid #ffd0d0; border-radius: var(--r); color: #c0392b; text-align: center; }

    /* ── EMBED MODE (quando aberto via iframe no gerencial) ── */
    html.embed .header { display: none; }
    html.embed .main   { padding-top: 16px; padding-bottom: 24px; }

    /* ── SKELETON LOADING ───────────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: -700px 0; }
      100% { background-position:  700px 0; }
    }
    .sk {
      background: linear-gradient(90deg, #edf0f4 25%, #dde2e8 50%, #edf0f4 75%);
      background-size: 700px 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 6px; display: block;
    }
    .sk-hero { background: var(--card); border: 1px solid var(--borda); border-radius: var(--r); box-shadow: var(--sh); padding: 24px 28px; margin-bottom: 24px; display: flex; align-items: center; gap: 20px; }
    .sk-kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .sk-kpi { background: var(--card); border: 1px solid var(--borda); border-radius: var(--r); box-shadow: var(--sh); padding: 20px 22px; }
    .sk-group { background: var(--card); border: 1px solid var(--borda); border-radius: var(--r); box-shadow: var(--sh); overflow: hidden; margin-bottom: 12px; }
    .sk-group-header { padding: 14px 20px; background: #fafbfc; border-bottom: 1px solid var(--borda); }
    .sk-row { display: grid; grid-template-columns: 68px 1fr 140px; align-items: center; gap: 20px; padding: 16px 20px; border-bottom: 1px solid #f1f5f9; }
    .sk-row:last-child { border-bottom: none; }

    /* ── DATE HERO ──────────────────────────────────────── */
    .date-hero { background: var(--card); border: 1px solid var(--borda); border-radius: var(--r); box-shadow: var(--sh); padding: 24px 28px; margin-bottom: 24px; display: flex; align-items: center; gap: 20px; }
    .date-pill { background: var(--preto); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 5px 12px; border-radius: 20px; flex-shrink: 0; }
    .date-info .dia { font-size: 22px; font-weight: 800; letter-spacing: -.4px; }
    .date-info .iso { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ── KPI GRID ───────────────────────────────────────── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .kpi { background: var(--card); border: 1px solid var(--borda); border-radius: var(--r); box-shadow: var(--sh); padding: 20px 22px; position: relative; overflow: hidden; }
    .kpi.total       { border-left: 4px solid var(--rosa); }
    .kpi.kpi-indev   { border-left: 4px solid #94a3b8; }
    .kpi.kpi-ajust   { border-left: 4px solid #10b981; }
    .kpi-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 10px; }
    .kpi-num { font-size: 40px; font-weight: 900; letter-spacing: -2px; line-height: 1; color: var(--preto); }
    .kpi.total .kpi-num     { color: var(--rosa); }
    .kpi.kpi-indev .kpi-num { color: #64748b; }
    .kpi.kpi-ajust .kpi-num { color: #059669; }
    .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .kpi-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--rosa), transparent); border-radius: 0 2px 0 0; }

    /* ── SEÇÕES ─────────────────────────────────────────── */
    .section { margin-bottom: 28px; }
    .section-head { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 14px; }
    .section-head::before { content: ""; display: block; width: 3px; height: 14px; background: var(--rosa); border-radius: 2px; flex-shrink: 0; }
    .section-hint { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: .65; font-size: 11px; margin-left: 2px; }

    /* ── BARRA DE FILTROS UNIFICADA ────────────────────── */
    .filtros-bar { background: var(--card); border: 1px solid var(--borda); border-radius: var(--r); box-shadow: var(--sh); padding: 12px 18px; margin-bottom: 14px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .filtro-grupo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filtro-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .filtro-sep   { width: 1px; height: 22px; background: var(--borda); flex-shrink: 0; }
    .filtro-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); flex-shrink: 0; }
    .filtro-pill  { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--borda); background: var(--card); font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .15s; line-height: 1.6; }
    .filtro-pill:hover { border-color: var(--rosa); color: var(--rosa); }
    .filtro-pill.ativo { background: var(--rosa); border-color: var(--rosa); color: #fff; }
    .filtro-pill.ativo .filtro-cnt { background: rgba(255,255,255,.25); color: #fff; }
    .filtro-dot-f { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .filtro-cnt   { font-size: 10px; background: var(--bg); color: var(--muted); padding: 0 5px; border-radius: 8px; }

    /* ── GRUPOS DE AGENTE ───────────────────────────────── */
    .ticket-list { display: flex; flex-direction: column; gap: 12px; }
    .agent-group { background: var(--card); border: 1px solid var(--borda); border-radius: var(--r); box-shadow: var(--sh); overflow: hidden; transition: box-shadow .15s, transform .15s; }
    .agent-group:hover { box-shadow: var(--sh-lg); transform: translateY(-1px); }
    .agent-group.n1 { border-left: 4px solid #fca5a5; }
    .agent-group.n2 { border-left: 4px solid #fdba74; }
    .agent-group.n3 { border-left: 4px solid #fde68a; }
    .agent-header { padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #fafbfc; border-bottom: 1px solid var(--borda); flex-wrap: wrap; }
    .agent-header-nome  { font-size: 14px; font-weight: 700; }
    .agent-header-count { font-size: 11px; color: var(--muted); font-weight: 600; }
    .agent-tabs { display: flex; gap: 6px; }
    .agent-tab { padding: 4px 12px; border-radius: 20px; border: 1px solid var(--borda); background: var(--card); color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 5px; }
    .agent-tab.ativo { background: var(--preto); border-color: var(--preto); color: #fff; }
    .agent-tab.pos.ativo { background: #16a34a; border-color: #16a34a; color: #fff; }
    .agent-tab:hover:not(.ativo) { border-color: var(--rosa); color: var(--rosa); }
    .agent-tab-cnt { font-size: 10px; font-weight: 800; opacity: .75; }
    .agent-tab-cnt.pos { color: #16a34a; }
    .tab-content.hidden { display: none; }

    /* ── LINHA DE TICKET ────────────────────────────────── */
    .agent-ticket-row { display: grid; grid-template-columns: 68px 1fr auto; align-items: start; gap: 20px; padding: 16px 20px; border-bottom: 1px solid #f1f5f9; cursor: default; transition: background .12s, opacity .2s; }
    .agent-ticket-row:last-child { border-bottom: none; }
    .agent-ticket-row:hover { background: #fafbfd; }
    .agent-ticket-row.indevida { opacity: .42; }

    /* ── CSAT BLOCO ─────────────────────────────────────── */
    .csat-bloco { width: 64px; height: 64px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; gap: 3px; }
    .csat-bloco.n1 { background: #fef2f2; border: 2px solid #fca5a5; }
    .csat-bloco.n2 { background: #fff4f0; border: 2px solid #fdba74; }
    .csat-bloco.n3 { background: #fffbeb; border: 2px solid #fde68a; }
    .csat-num { font-size: 26px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
    .n1 .csat-num { color: #991b1b; }
    .n2 .csat-num { color: #c2410c; }
    .n3 .csat-num { color: #92400e; }
    .csat-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; opacity: .55; }
    .n1 .csat-label { color: #991b1b; }
    .n2 .csat-label { color: #c2410c; }
    .n3 .csat-label { color: #92400e; }

    /* ── CORPO DO TICKET ────────────────────────────────── */
    .ticket-corpo { min-width: 0; padding-top: 2px; }
    .ticket-id-link { display: inline-flex; align-items: center; gap: 4px; font-family: monospace; font-size: 11px; color: var(--muted); text-decoration: none; opacity: .65; transition: opacity .15s; margin-bottom: 5px; }
    .ticket-id-link:hover { opacity: 1; color: var(--rosa); }
    .ticket-cliente { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .cliente-nome  { font-size: 13px; font-weight: 700; color: var(--preto); }
    .cliente-email { font-size: 11px; color: var(--muted); opacity: .75; }
    .ticket-feedback { font-size: 11px; color: var(--muted); font-style: italic; line-height: 1.45; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ticket-feedback::before { content: '"'; }
    .ticket-feedback::after  { content: '"'; }

    /* ── COLUNA DIREITA ─────────────────────────────────── */
    .ticket-direita { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 120px; }

    /* Criticidade */
    .crit-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: .3px; }
    .crit-alta  { background: #fef2f2; color: #b91c1c; border: 1px solid #fca5a5; }
    .crit-media { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .crit-dot   { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .crit-alta .crit-dot  { background: #b91c1c; }
    .crit-media .crit-dot { background: #b45309; }

    /* Tags compactas */
    .ticket-tags { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .tag-chip { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 500; color: var(--muted); background: var(--bg); border: 1px solid var(--borda); opacity: .8; white-space: nowrap; }
    .tag-chip.tag-mais { border-style: dashed; cursor: help; opacity: 1; font-weight: 600; }

    /* Indevida */
    .badge-indevida { display: inline-block; padding: 2px 8px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .5px; }
    .btn-desfazer  { padding: 4px 10px; border-radius: 6px; border: 1px solid #cbd5e1; background: transparent; font-size: 10px; font-weight: 600; color: #94a3b8; cursor: pointer; transition: all .15s; }
    .btn-desfazer:hover  { border-color: #ef4444; color: #ef4444; }

    /* Seção indevidas */
    .section-head.indev::before { background: #94a3b8; }
    .indev-row { display: grid; grid-template-columns: 68px 1fr auto; align-items: start; gap: 20px; padding: 14px 20px; border-bottom: 1px solid #f1f5f9; background: #fafbfc; }
    .indev-row:last-child { border-bottom: none; }
    .indev-meta { font-size: 10px; color: var(--muted); margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }

    /* ── TOOLTIP INTELIGENTE ────────────────────────────── */
    .ticket-tooltip {
      position: fixed; z-index: 2000; pointer-events: none;
      background: #0f172a; color: #e2e8f0;
      border-radius: 12px; padding: 14px 16px;
      font-size: 12px; max-width: 260px; min-width: 180px;
      opacity: 0; transition: opacity .12s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
      border: 1px solid rgba(255,255,255,.07);
      line-height: 1.55;
    }
    .ticket-tooltip.visivel { opacity: 1; }
    .tt-categoria { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; color: #94a3b8; margin-bottom: 10px; }
    .tt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 5px; font-size: 11px; }
    .tt-label { color: #64748b; }
    .tt-val   { font-weight: 600; color: #e2e8f0; }
    .tt-crit-alta  { color: #fca5a5; }
    .tt-crit-media { color: #fde68a; }
    .tt-crit-baixa { color: #86efac; }
    .tt-feedback { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.07); color: #94a3b8; font-size: 11px; font-style: italic; line-height: 1.5; }

    /* ── MODAL ──────────────────────────────────────────── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 500; display: none; align-items: center; justify-content: center; }
    .modal-overlay.aberto { display: flex; }
    .modal { background: #fff; border-radius: var(--r); box-shadow: var(--sh-lg); padding: 28px 32px; width: 440px; max-width: 92vw; }
    .modal-title { font-size: 16px; font-weight: 800; margin-bottom: 3px; }
    .modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 22px; }
    .modal-field { margin-bottom: 16px; }
    .modal-field label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 6px; }
    .modal-field select, .modal-field textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--borda); border-radius: 8px; font-size: 13px; font-family: inherit; background: var(--card); transition: border-color .15s; }
    .modal-field select:focus, .modal-field textarea:focus { outline: none; border-color: var(--rosa); }
    .modal-field textarea { resize: vertical; min-height: 80px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
    .btn-cancel  { padding: 8px 18px; border-radius: 8px; border: 1px solid var(--borda); background: var(--card); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
    .btn-cancel:hover  { border-color: var(--preto); color: var(--preto); }
    .btn-confirm { padding: 8px 18px; border-radius: 8px; border: none; background: var(--rosa); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
    .btn-confirm:hover { opacity: .85; }
    .btn-confirm:disabled { opacity: .5; cursor: default; }

    /* ── COPIAR RESUMO ──────────────────────────────────── */
    .btn-copiar { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--borda); background: var(--card); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; flex-shrink: 0; margin-left: auto; }
    .btn-copiar:hover { border-color: var(--rosa); color: var(--rosa); }
    .btn-copiar.copiado { border-color: #16a34a; color: #16a34a; background: #f0fdf4; }

    /* ── AGENTE CLICÁVEL ────────────────────────────────── */
    .agent-header-nome { cursor: pointer; transition: color .15s; }
    .agent-header-nome:hover { color: var(--rosa); }

    /* ── MODAL HISTÓRICO ────────────────────────────────── */
    .hist-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
    .hist-stat { background: #f8fafc; border-radius: 8px; padding: 12px 14px; }
    .hist-stat-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 6px; }
    .hist-stat-val   { font-size: 28px; font-weight: 900; color: var(--preto); line-height: 1; }
    .hist-chart-wrap { margin-top: 4px; }
    .hist-chart-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 8px; }

    /* ── MISC ───────────────────────────────────────────── */
    .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--borda); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .footer-brand { font-weight: 900; font-size: 14px; color: var(--preto); }
    .footer-brand b { color: var(--rosa); }
    .empty { padding: 40px; text-align: center; color: var(--muted); font-size: 13px; }
  </style>
  <script>if(location.search.includes('embed=true'))document.documentElement.classList.add('embed')</script>
</head>
<body>

<!-- Modal histórico da agente -->
<div class="modal-overlay" id="hist-overlay" onclick="if(event.target===this)closeHistModal()">
  <div class="modal" style="width:500px;max-width:95vw">
    <div id="hist-content"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeHistModal()">Fechar</button>
    </div>
  </div>
</div>


<header class="header">
  <div class="header-inner">
    <div class="logo">INK<b>.</b></div>
    <div class="sep"></div>
    <div class="hdr-meta">
      <h1>Relatório CSAT — Avaliações</h1>
      <p>Notas 1 a 5 · Agentes monitoradas</p>
    </div>
    <a class="btn-back" href="/">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Voltar
    </a>
  </div>
</header>

<main class="main">
  <div id="conteudo"></div>
  <div class="footer">
    <span class="footer-brand">INK<b>.</b></span>
    <span>Atualizado automaticamente todo dia útil às 7h</span>
  </div>
</main>

<script>
  const API = '';
  const MESES  = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const SEMANA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

  /* ── INTELIGÊNCIA ─────────────────────────────────────── */
  const PALAVRAS_ALTA  = ['procon','processo','chargeback','nunca mais','pessimo','horrivel','absurdo','ridiculo','enganado','fraude','golpe','roubo','advogado','consumidor.gov','reclame aqui','acao judicial'];
  const PALAVRAS_MEDIA = ['atraso','demorou','demora','esperando','nao recebi','errado','trocado','defeito','quebrado','arrependimento','insatisfeito','ruim','problema','reclamacao'];

  const TAG_CATEGORIAS = {
    entrega:'Entrega', atraso:'Entrega', logistic:'Entrega', rastreio:'Entrega', envio:'Entrega', transporte:'Entrega', extravio:'Entrega',
    financeiro:'Financeiro', estorno:'Financeiro', reembolso:'Financeiro', chargeback:'Financeiro', cobran:'Financeiro', pagamento:'Financeiro',
    troca:'Troca', devoluc:'Troca', tamanho:'Troca', arrependimento:'Troca', produto:'Produto', defeito:'Produto', danificad:'Produto',
    cancelamento:'Cancelamento',
    atendimento:'Atendimento', demora:'Atendimento', comunicac:'Atendimento', suporte:'Atendimento',
  };
  const TAG_PESO = {
    chargeback:10, extravio:9, cancelamento:9, fraude:10,
    defeito:7, devolucao:6, financeiro:6, atraso:6, entrega:5, troca:5,
    rastreio:3, tamanho:2,
  };

  function norm(s) { return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
  function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function formatTag(nome) { return (nome||'').replace(/_/g,' '); }
  function formatarData(s) {
    const [a,m,d] = s.split('-').map(Number);
    return `${SEMANA[new Date(a,m-1,d).getDay()]}, ${d} de ${MESES[m-1]} de ${a}`;
  }

  function getTagPeso(tag) {
    const n = norm(tag).replace(/[_\s]/g,'');
    for (const [k,v] of Object.entries(TAG_PESO)) { if (n.includes(k)) return v; }
    return 1;
  }
  function sortTagsByRelevance(tags) { return [...(tags||[])].sort((a,b) => getTagPeso(b) - getTagPeso(a)); }

  function getCategoriaPrincipal(tags) {
    if (!tags || !tags.length) return null;
    const first = norm(sortTagsByRelevance(tags)[0]).replace(/[_\s]/g,'');
    for (const [k,cat] of Object.entries(TAG_CATEGORIAS)) { if (first.includes(norm(k))) return cat; }
    return formatTag(tags[0]);
  }

  function getMotivoPrincipal(tags) {
    if (!tags || !tags.length) return null;
    return formatTag(sortTagsByRelevance(tags)[0]);
  }

  function calcularCriticidade(ticket) {
    let s = 0;
    if (ticket.nota === 1) s += 10;
    else if (ticket.nota === 2) s += 5;
    else s += 2;

    const tags = (ticket.tags||[]).map(t => norm(t));
    if (tags.some(t => ['chargeback','extravio','fraude','cancelamento'].some(k => t.includes(k)))) s += 8;
    else if (tags.some(t => ['defeito','devolucao','financeiro','atraso','entrega'].some(k => t.includes(k)))) s += 4;

    const fb = norm(ticket.feedback || '');
    if (PALAVRAS_ALTA.some(w => fb.includes(norm(w)))) s += 12;
    else if (PALAVRAS_MEDIA.some(w => fb.includes(norm(w)))) s += 5;

    if (s >= 18) return 'alta';
    if (s >= 9)  return 'media';
    return 'baixa';
  }

  function renderTagsCompact(tags) {
    if (!tags || !tags.length) return '';
    const sorted  = sortTagsByRelevance(tags);
    const visible = sorted.slice(0, 2);
    const hidden  = sorted.slice(2);
    let html = visible.map(t => `<span class="tag-chip">${formatTag(t)}</span>`).join('');
    if (hidden.length) {
      html += `<span class="tag-chip tag-mais" title="${hidden.map(formatTag).join(' · ')}">+${hidden.length}</span>`;
    }
    return html;
  }

  /* ── FILTROS ──────────────────────────────────────────── */
  function applyFilters() {
    document.querySelectorAll('.agent-group').forEach(group => {
      if (activeAgent && group.dataset.agente !== activeAgent) { group.style.display = 'none'; return; }
      let visible = 0;
      group.querySelectorAll('.agent-ticket-row').forEach(row => {
        const rowTags = (row.dataset.tags||'').split(',').filter(Boolean);
        const ok = !activeTag || rowTags.includes(activeTag);
        row.style.display = ok ? '' : 'none';
        if (ok) visible++;
      });
      group.style.display = visible ? '' : 'none';
    });
  }

  function switchTab(btn, showId, hideId) {
    const group = btn.closest('.agent-group');
    group.querySelectorAll('.agent-tab').forEach(b => b.classList.remove('ativo'));
    btn.classList.add('ativo');
    document.getElementById(showId).classList.remove('hidden');
    document.getElementById(hideId).classList.add('hidden');
  }

  function filterByAgent(pill) {
    document.querySelectorAll('#filtro-agente .filtro-pill').forEach(p => p.classList.remove('ativo'));
    pill.classList.add('ativo');
    activeAgent = pill.dataset.agente;
    applyFilters();
  }

  function filterByTag(btn, tag) {
    if (activeTag === tag) {
      activeTag = ''; btn.classList.remove('ativo');
    } else {
      document.querySelectorAll('.filtro-tag').forEach(b => b.classList.remove('ativo'));
      btn.classList.add('ativo'); activeTag = tag;
    }
    applyFilters();
  }

  /* ── COPIAR RESUMO ───────────────────────────────────── */
  function copiarResumo() {
    if (!reportData) return;
    const d  = reportData;
    const im = reportIndevidaMap;
    const indevidaCount = Object.keys(im).length;
    const ajustado = d.total - indevidaCount;

    const agentLines = Object.entries(d.por_agente || {})
      .sort((a,b) => b[1]-a[1])
      .map(([nome,cnt]) => `• ${nome}: ${cnt}`)
      .join('\n');

    const tagsTop = Object.entries(d.tags_resumo || {})
      .sort((a,b) => b[1]-a[1]).slice(0,3)
      .map(([t,c]) => `${formatTag(t)} (${c})`).join(', ');

    const critCount = (d.tickets||[]).filter(t => calcularCriticidade(t) === 'alta').length;
    const [a,m,dia] = d.date.split('-');

    const texto = [
      `📊 CSAT Negativo — ${dia}/${m}/${a}`,
      `Total: ${d.total} avaliações negativas`,
      indevidaCount ? `(${indevidaCount} indevida${indevidaCount>1?'s':''} · ${ajustado} reais)` : null,
      '',
      'Por agente:',
      agentLines,
      tagsTop   ? `\nTags: ${tagsTop}` : null,
      critCount ? `Críticos: ${critCount} ticket${critCount>1?'s':''}` : null,
    ].filter(l => l !== null).join('\n');

    navigator.clipboard.writeText(texto).then(() => {
      const btn = document.getElementById('btn-copiar');
      const orig = btn.innerHTML;
      btn.textContent = '✓ Copiado!';
      btn.classList.add('copiado');
      setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copiado'); }, 2000);
    }).catch(() => alert('Erro ao acessar clipboard.'));
  }

  /* ── HISTÓRICO DA AGENTE ──────────────────────────────── */
  function renderHistoryChart(history) {
    if (!history.length) return '<p style="color:#94a3b8;font-size:12px;text-align:center;padding:16px 0">Sem dados no período</p>';
    const W = 440, H = 64, LABEL_H = 18;
    const max  = Math.max(...history.map(d => d.count), 1);
    const n    = history.length;
    const barW = Math.max(4, Math.floor((W - (n-1)*2) / n));
    const gap  = n > 1 ? (W - n*barW) / (n-1) : 0;
    const step = n <= 10 ? 1 : n <= 20 ? 2 : 4;
    const els  = history.map((d, i) => {
      const h   = Math.max(3, Math.round((d.count / max) * H));
      const x   = Math.round(i * (barW + gap));
      const y   = H - h;
      const cx  = x + barW / 2;
      const col = d.count >= 6 ? '#dc2626' : d.count >= 3 ? '#e91e8c' : '#f48dc1';
      const dt  = d.date.slice(8) + '/' + d.date.slice(5,7);
      const bar   = `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${col}" rx="2"><title>${dt}: ${d.count}</title></rect>`;
      const label = (i % step === 0)
        ? `<text x="${cx}" y="${H + 13}" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="system-ui,sans-serif">${dt}</text>`
        : '';
      return bar + label;
    }).join('');
    const totalH = H + LABEL_H;
    return `<svg viewBox="0 0 ${W} ${totalH}" width="100%" height="${totalH}" style="display:block">${els}</svg>`;
  }

  function calcTendencia(history) {
    if (history.length < 4) return null;
    const mid = Math.floor(history.length / 2);
    const avgA = history.slice(0, mid).reduce((s,d) => s+d.count, 0) / mid;
    const avgB = history.slice(mid).reduce((s,d) => s+d.count, 0) / (history.length - mid);
    const diff = avgB - avgA;
    if (Math.abs(diff) < 0.4) return { label:'Estável',    dir:0,  color:'#64748b' };
    if (diff > 0)              return { label:'Piorando',   dir:1,  color:'#dc2626' };
    return                            { label:'Melhorando', dir:-1, color:'#16a34a' };
  }

  async function openAgentHistory(name) {
    const overlay = document.getElementById('hist-overlay');
    const content = document.getElementById('hist-content');
    content.innerHTML = `
      <div class="modal-title">${escHtml(name)}</div>

    overlay.classList.add('aberto');

    try {
      const r = await fetch(`${API}/agent-history/${encodeURIComponent(name)}`);
      const history = await r.json();
      const total = history.reduce((s,d) => s+d.count, 0);
      const media = history.length ? (total/history.length).toFixed(1) : '0';

          ${tend ? `<span style="font-size:12px;font-weight:700;color:${tend.color}">${tend.dir===1?'↑':tend.dir===-1?'↓':'→'} ${tend.label}</span>` : ''}

  /* ── INIT ─────────────────────────────────────────────── */
  async function init() {
    const params = new URLSearchParams(window.location.search);
    const date = params.get('date');
    currentDate = date;
    const el = document.getElementById('conteudo');

    if (!date) { el.innerHTML = `<div class="erro">Data não informada. Use o calendário.</div>`; return; }
    document.title = `CSAT ${date} — INK`;

    el.innerHTML = renderSkeleton();

    try {
      const [rData, rIndev] = await Promise.all([fetch(`${API}/data/${date}`), fetch(`${API}/indevidas/${date}`)]);
      if (!rData.ok) {
        const err = await rData.json().catch(() => ({}));
        el.innerHTML = `<div class="erro">Relatório não encontrado para <strong>${date}</strong>.<br>${err.error||''}</div>`;
        return;
      }
      const [data, indevidas] = await Promise.all([rData.json(), rIndev.json().catch(() => [])]);
      const indevidaMap = {};
      (Array.isArray(indevidas) ? indevidas : []).forEach(i => { indevidaMap[String(i.ticket_id)] = i; });
      render(data, indevidaMap, el);
    } catch(e) {
      el.innerHTML = `<div class="erro">Erro ao carregar: ${e.message}</div>`;
    }
  }

  /* ── RENDER ───────────────────────────────────────────── */
  function render(d, indevidaMap, el) {
    reportData = d;
    reportIndevidaMap = indevidaMap;
    const { date, total=0, por_agente={}, tags_resumo={}, tickets=[], tickets_positivos=[] } = d;
    const agentes = Object.entries(por_agente).sort((a,b) => b[1]-a[1]);
    const tags    = Object.entries(tags_resumo).sort((a,b) => b[1]-a[1]);
    const maxAg   = agentes[0]?.[1] || 1;
    const indevidaCount = Object.keys(indevidaMap).length;

    /* KPIs */
    const totalRecebidas = total + tickets_positivos.length;
    let kpis = `
      <div class="kpi">
        <div class="kpi-label">Recebidas</div>
        <div class="kpi-num">${totalRecebidas}</div>
        <div class="kpi-sub">avaliações no dia</div>
      </div>
      <div class="kpi" style="border-left:4px solid #86efac">
        <div class="kpi-label">Positivas</div>
        <div class="kpi-num" style="color:#16a34a">${tickets_positivos.length}</div>
        <div class="kpi-sub">notas 4 e 5</div>
      </div>
      <div class="kpi total">
        <div class="kpi-label">Negativas</div>
        <div class="kpi-num">${total}</div>
        <div class="kpi-sub">notas 1, 2 e 3</div>
      </div>`;
    if (indevidaCount > 0) {
      kpis += `
        <div class="kpi kpi-indev">
          <div class="kpi-label">Indevidas</div>
          <div class="kpi-num">${indevidaCount}</div>
          <div class="kpi-sub">avaliações indevidas</div>
        </div>
        <div class="kpi kpi-ajust">
          <div class="kpi-label">Negativos reais</div>
          <div class="kpi-num">${total - indevidaCount}</div>
          <div class="kpi-sub">após auditoria</div>
        </div>`;
    }

    /* Barra de filtros unificada */
    const TAG_COR = { Entrega:'#1d4ed8', Financeiro:'#15803d', Troca:'#b45309', Produto:'#7e22ce', Cancelamento:'#c2410c', Atendimento:'#0369a1' };

    /* Todos os agentes (pos + neg) para o filtro */
    const agentesNegNomes = agentes.map(([n]) => n);
    const agentesPosList  = [...new Set(tickets_positivos.map(t => t.agente).filter(Boolean))];
    const todosAgentesNomes = [...new Set([...agentesNegNomes, ...agentesPosList])];

    let filtrosHtml = '';
    if (todosAgentesNomes.length > 1 || tags.length > 0) {
      filtrosHtml = `<div class="filtros-bar">`;
      if (todosAgentesNomes.length > 1) {
        filtrosHtml += `
          <div class="filtro-grupo">
            <span class="filtro-label">Agente</span>
            <div class="filtro-pills" id="filtro-agente">
              <button class="filtro-pill ativo" data-agente="" onclick="filterByAgent(this)">Todas</button>
              ${todosAgentesNomes.map(n => `<button class="filtro-pill" data-agente="${n}" onclick="filterByAgent(this)">${n.split(' ')[0]}</button>`).join('')}
            </div>
          </div>`;
      }
      if (tags.length > 0) {
        if (agentes.length > 1) filtrosHtml += `<div class="filtro-sep"></div>`;
        filtrosHtml += `
          <div class="filtro-grupo">
            <span class="filtro-label">Tag</span>
            <div class="filtro-pills">
              ${tags.map(([tag,cnt]) => {
                const cat = getCategoriaPrincipal([tag]) || 'default';
                const cor = TAG_COR[cat] || '#475569';
                return `<button class="filtro-pill filtro-tag" data-tag="${tag}" onclick="filterByTag(this,'${tag}')"><span class="filtro-dot-f" style="background:${cor}"></span>${formatTag(tag)}<span class="filtro-cnt">${cnt}</span></button>`;
              }).join('')}
            </div>
          </div>`;
      }
      filtrosHtml += `</div>`;
    }

    /* Ordenação e agrupamento */
    const ordemAgente = {};
    agentes.forEach(([n],i) => { ordemAgente[n] = i; });
    const ticketsOrdenados = [...tickets].sort((a,b) => {
      const oa = ordemAgente[a.agente]??99, ob = ordemAgente[b.agente]??99;
      return oa!==ob ? oa-ob : a.nota-b.nota;
    });
    const grupoMap = {};
    ticketsOrdenados.forEach(t => {
      const k = t.agente||'—';
      if (!grupoMap[k]) grupoMap[k] = [];
      grupoMap[k].push(t);
    });

    /* Linha de ticket */
    function ticketRowHtml(t) {
      const nc  = `n${t.nota}`;
      const sid = String(t.id);
      const isIndevida = !!indevidaMap[sid];
      const crit = calcularCriticidade(t);

      // Salva para tooltip
      ticketDataMap[sid] = { nota: t.nota, tags: t.tags, feedback: t.feedback };

      const idHtml = t.link
        ? `<a class="ticket-id-link" href="${t.link}" target="_blank" rel="noopener">#${t.id}<svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg></a>`
        : `<span class="ticket-id-link" style="cursor:default">#${t.id||'—'}</span>`;

      const clienteHtml = (t.cliente_nome||t.cliente_email) ? `
        <div class="ticket-cliente">
          ${t.cliente_nome  ? `<span class="cliente-nome">${escHtml(t.cliente_nome)}</span>`  : ''}
          ${t.cliente_email ? `<span class="cliente-email">${escHtml(t.cliente_email)}</span>` : ''}
        </div>` : '';

      const feedbackHtml = t.feedback
        ? `<div class="ticket-feedback">${escHtml(t.feedback)}</div>` : '';

      const critHtml = (crit === 'alta' || crit === 'media')
        ? `<span class="crit-badge crit-${crit}"><span class="crit-dot"></span>${crit==='alta'?'Crítico':'Atenção'}</span>` : '';

      const tagsChips = renderTagsCompact(t.tags);
      const indevidaCtrl = isIndevida
        ? `<span class="badge-indevida">Indevida</span>`
        : '';

      return `
        <div class="agent-ticket-row${isIndevida?' indevida':''}" data-tags="${(t.tags||[]).join(',')}" data-tid="${sid}">
          <div class="csat-bloco ${nc}">
            <span class="csat-num">${t.nota}</span>
            <span class="csat-label">CSAT</span>
          </div>
          <div class="ticket-corpo">
            ${idHtml}
            ${clienteHtml}
            ${feedbackHtml}
          </div>
          <div class="ticket-direita">
            ${critHtml}
            <div class="ticket-tags">${tagsChips}</div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-top:2px">${indevidaCtrl}</div>
          </div>
        </div>`;
    }

    /* Agrupamento de positivos por agente */
    const grupoMapPos = {};
    tickets_positivos.forEach(t => {
      const k = t.agente || '—';
      if (!grupoMapPos[k]) grupoMapPos[k] = [];
      grupoMapPos[k].push(t);
    });

    /* Linha de ticket positivo (sem tags/criticidade) */
    function posTicketRowHtml(t) {
      const idHtml = t.link
        ? `<a class="ticket-id-link" href="${t.link}" target="_blank" rel="noopener">#${t.id}<svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg></a>`
        : `<span class="ticket-id-link" style="cursor:default">#${t.id||'—'}</span>`;
      const clienteHtml = (t.cliente_nome||t.cliente_email) ? `
        <div class="ticket-cliente">
          ${t.cliente_nome  ? `<span class="cliente-nome">${escHtml(t.cliente_nome)}</span>`  : ''}
          ${t.cliente_email ? `<span class="cliente-email">${escHtml(t.cliente_email)}</span>` : ''}
        </div>` : '';
      const feedbackHtml = t.feedback ? `<div class="ticket-feedback" style="color:#15803d">${escHtml(t.feedback)}</div>` : '';
      const tagsChips = renderTagsCompact(t.tags || []);
      return `
        <div class="agent-ticket-row" style="border-left:3px solid #86efac">
          <div class="csat-bloco" style="background:#f0fdf4;border:1.5px solid #86efac;color:#16a34a">
            <span class="csat-num">${t.nota}</span>
            <span class="csat-label">CSAT</span>
          </div>
          <div class="ticket-corpo">
            ${idHtml}
            ${clienteHtml}
            ${feedbackHtml}
          </div>
          <div class="ticket-direita">
            <div class="ticket-tags">${tagsChips}</div>
          </div>
        </div>`;
    }

    /* União dos agentes (neg + pos) na ordem do ranking de negativos */
    const todosAgentesSet = [...new Set([...Object.keys(grupoMap), ...Object.keys(grupoMapPos)])];
    todosAgentesSet.sort((a,b) => ((ordemAgente[a]??99) - (ordemAgente[b]??99)));

    const linhas = todosAgentesSet.map(agente => {
      const agNeg = grupoMap[agente] || [];
      const agPos = grupoMapPos[agente] || [];
      const piorNota = agNeg.length ? Math.min(...agNeg.map(t => t.nota||5)) : 5;
      const idSafe   = agente.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
      const tabNegId = `tab-neg-${idSafe}`;
      const tabPosId = `tab-pos-${idSafe}`;
      return `
        <div class="agent-group n${piorNota}" data-agente="${agente}">
          <div class="agent-header">
            <span class="agent-header-nome" onclick="openAgentHistory('${agente}')" title="Ver histórico de ${agente}">${agente}</span>
            <div class="agent-tabs">
              <button class="agent-tab pos ativo" onclick="switchTab(this,'${tabPosId}','${tabNegId}')">
                Positivas <span class="agent-tab-cnt pos">${agPos.length}</span>
              </button>
              <button class="agent-tab" onclick="switchTab(this,'${tabNegId}','${tabPosId}')">
                Negativas <span class="agent-tab-cnt">${agNeg.length}</span>
              </button>
            </div>
          </div>
          <div id="${tabPosId}" class="tab-content">
            ${agPos.length ? agPos.map(posTicketRowHtml).join('') : '<div style="padding:16px 24px;color:var(--muted);font-size:12px">Sem avaliações positivas nesse dia</div>'}
          </div>
          <div id="${tabNegId}" class="tab-content hidden">
            ${agNeg.length ? agNeg.map(ticketRowHtml).join('') : '<div style="padding:16px 24px;color:var(--muted);font-size:12px">Sem avaliações negativas nesse dia</div>'}
          </div>
        </div>`;
    }).join('');

    /* Seção indevidas */
    const indevidaEntries = Object.entries(indevidaMap);
    let indevidaSectionHtml = '';
    if (indevidaEntries.length > 0) {
      const allTicketsMap = {};
      [...tickets, ...tickets_positivos].forEach(t => { allTicketsMap[String(t.id)] = t; });

      const indevidaRows = indevidaEntries.map(([tid, meta]) => {
        const t = allTicketsMap[tid];
        const marcadoPor = meta.observacao || '—';
        const marcadoEm  = meta.marcado_em ? new Date(meta.marcado_em).toLocaleString('pt-BR') : '—';

        const ticketLink = (t && t.link) || `https://cloudchat3.cloudhumans.com/app/accounts/73/conversations/${tid}`;
        const idHtml = `<a class="ticket-id-link" href="${ticketLink}" target="_blank" rel="noopener">#${tid}<svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg></a>`;

        return `
          <div class="indev-row">
            ${idHtml}
            <div>
              ${t ? `<div style="font-size:12px;font-weight:600;color:#475569">Nota ${t.nota} · ${escHtml(t.agente||'—')}</div>` : ''}
              ${t && t.feedback ? `<div style="font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4">${escHtml(t.feedback.slice(0,120))}${t.feedback.length>120?'…':''}</div>` : ''}
              <div class="indev-meta">
                <span>Marcado por: <strong>${escHtml(marcadoPor)}</strong></span>
                <span>Em: ${marcadoEm}</span>
              </div>
            </div>
            <button class="btn-desfazer" onclick="desfazerIndevida('${tid}')">Desfazer</button>
          </div>`;
      }).join('');

      indevidaSectionHtml = `
        <div class="section">
          <div class="section-head indev">
            Avaliações Indevidas
            <span style="background:#e2e8f0;color:#64748b;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;margin-left:8px">${indevidaEntries.length}</span>
          </div>
          <div class="ticket-list">${indevidaRows}</div>
          <div style="padding:10px 20px 14px;font-size:11px;color:var(--muted);border-top:1px solid #f1f5f9">
            Marcadas automaticamente via CloudChat quando "Avaliação de CSAT é inválida?" é ativada. Use "Desfazer" para remover uma marcação incorreta.
          </div>
        </div>`;
    }

    el.innerHTML = `
      <div class="date-hero">
        <div class="date-pill">Relatório do dia</div>
        <div class="date-info" style="flex:1">
          <div class="dia">${formatarData(date)}</div>
          <div class="iso">${date}</div>
        </div>
        <button class="btn-copiar" id="btn-copiar" onclick="copiarResumo()">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copiar resumo
        </button>
      </div>

      <div class="kpi-grid">${kpis}</div>

      <div class="section">
        <div class="section-head">Tickets avaliados</div>
        ${tickets.length > 0
          ? `${filtrosHtml}<div class="ticket-list">${linhas}</div>`
          : '<div class="empty">Nenhum ticket registrado neste dia.</div>'}
      </div>

      ${indevidaSectionHtml}`;

    /* Ativa tooltips nos tickets */
    document.querySelectorAll('[data-tid]').forEach(row => {
      const t = ticketDataMap[row.dataset.tid];
      if (!t) return;
      row.addEventListener('mouseenter', e => showTooltip(e, t));
      row.addEventListener('mousemove',  positionTooltip);
      row.addEventListener('mouseleave', hideTooltip);
    });
  }

  init();
</script>
</body>
</html>

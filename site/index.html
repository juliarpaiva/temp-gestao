<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel CSAT — INK</title>
  <style>
    :root {
      --rosa:   #e91e8c;
      --rosa-s: rgba(233,30,140,.08);
      --preto:  #0f0f0f;
      --bg:     #f0f2f5;
      --card:   #ffffff;
      --borda:  #e2e8f0;
      --muted:  #64748b;
      --r:      12px;
      --sh:     0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
      --sh-lg:  0 2px 8px rgba(0,0,0,.08), 0 8px 32px rgba(0,0,0,.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--preto); font-size: 14px; line-height: 1.6; }

    /* HEADER */
    .header { background: var(--preto); color: #fff; border-bottom: 3px solid var(--rosa); position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 1140px; margin: 0 auto; padding: 0 32px; height: 64px; display: flex; align-items: center; gap: 16px; }
    .logo { font-size: 24px; font-weight: 900; letter-spacing: -1px; color: #fff; }
    .logo b { color: var(--rosa); }
    .sep { width: 1px; height: 26px; background: #2a2a2a; }
    .hdr-meta h1 { font-size: 14px; font-weight: 700; }
    .hdr-meta p  { font-size: 11px; color: #666; margin-top: 1px; }
    .btn-gestao { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; background: #1a1a1a; color: #aaa; font-size: 12px; font-weight: 600; text-decoration: none; border: 1px solid #2a2a2a; flex-shrink: 0; transition: all .15s; }
    .btn-gestao:hover { background: var(--rosa); color: #fff; border-color: var(--rosa); }

    /* LAYOUT */
    .main { max-width: 1140px; margin: 0 auto; padding: 36px 32px 80px; }

    /* LOADING */
    .loading { text-align: center; padding: 80px 0; color: var(--muted); }
    .loading-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--rosa); margin: 0 3px; animation: bounce .9s infinite; }
    .loading-dot:nth-child(2) { animation-delay: .15s; }
    .loading-dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }

    /* FILTRO DE PERÍODO */
    .filtro-bar {
      background: var(--card); border: 1px solid var(--borda); border-radius: var(--r);
      box-shadow: var(--sh); padding: 16px 24px; margin-bottom: 28px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .filtro-bar-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); flex-shrink: 0; }
    .filtro-bar-inputs { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filtro-bar-inputs label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .filtro-bar-inputs input[type=date] { padding: 6px 10px; border: 1px solid var(--borda); border-radius: 8px; font-size: 13px; font-family: inherit; color: var(--preto); background: #fafbfc; }
    .filtro-bar-inputs input[type=date]:focus { outline: none; border-color: var(--rosa); }
    .btn-filtrar { padding: 7px 18px; border-radius: 8px; border: none; background: var(--rosa); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; transition: opacity .15s; }
    .btn-filtrar:hover { opacity: .85; }
    .btn-limpar { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--borda); background: var(--card); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; display: none; }
    .btn-limpar:hover { border-color: var(--preto); color: var(--preto); }

    /* RESULTADO DE PERÍODO */
    .periodo-panel {
      background: var(--card); border: 1px solid var(--borda); border-radius: var(--r);
      box-shadow: var(--sh); margin-bottom: 28px; overflow: hidden;
    }
    .periodo-head {
      padding: 16px 24px; border-bottom: 1px solid var(--borda); background: #fafbfc;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    .periodo-titulo { font-size: 14px; font-weight: 800; }
    .periodo-stats { display: flex; gap: 20px; }
    .periodo-stat { text-align: center; }
    .periodo-stat-val { font-size: 22px; font-weight: 900; letter-spacing: -1px; color: var(--rosa); line-height: 1; }
    .periodo-stat-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-top: 2px; }
    .periodo-dias-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding: 16px 24px;
    }
    .periodo-dia {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 10px; padding: 12px 8px; text-decoration: none; font-weight: 700;
      transition: transform .15s, box-shadow .15s;
    }
    .periodo-dia:hover { transform: scale(1.04); box-shadow: 0 4px 16px rgba(233,30,140,.25); }
    .periodo-dia.vol-baixo { background: #fff; border: 2px solid #e91e8c; color: #e91e8c; }
    .periodo-dia.vol-medio { background: #e91e8c; border: 2px solid #e91e8c; color: #fff; }
    .periodo-dia.vol-alto  { background: #9d1366; border: 2px solid #9d1366; color: #fff; }
    .periodo-dia-data { font-size: 13px; font-weight: 800; }
    .periodo-dia-cnt  { font-size: 11px; margin-top: 3px; opacity: .85; }

    /* MESES */
    .month-section { margin-bottom: 40px; }
    .month-title {
      font-size: 18px; font-weight: 800; letter-spacing: -.3px;
      margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
    }
    .month-title::before {
      content: ""; display: block; width: 3px; height: 20px;
      background: var(--rosa); border-radius: 2px;
    }

    /* CALENDÁRIO */
    .calendar { background: var(--card); border: 1px solid var(--borda); border-radius: var(--r); box-shadow: var(--sh); overflow: hidden; }
    .cal-header { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--preto); }
    .cal-header span { padding: 10px; text-align: center; font-size: 10px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 1px; }
    .cal-grid { display: grid; grid-template-columns: repeat(5, 1fr); }
    .cal-cell { min-height: 64px; border: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: center; }
    .cal-cell.empty { background: #fafafa; }

    .cal-day {
      width: 48px; height: 48px; border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px; gap: 0; cursor: default; color: #cbd5e1;
    }
    .cal-day.tem-dados {
      cursor: pointer; text-decoration: none;
      transition: transform .15s, box-shadow .15s;
    }
    .cal-day.tem-dados:hover { transform: scale(1.1); box-shadow: 0 4px 16px rgba(233,30,140,.3); }
    .cal-day.vol-baixo  { background: #fff; border: 2px solid #e91e8c; color: #e91e8c; }
    .cal-day.vol-medio  { background: #e91e8c; border: 2px solid #e91e8c; color: #fff; }
    .cal-day.vol-alto   { background: #9d1366; border: 2px solid #9d1366; color: #fff; }
    .cal-day.vol-baixo:hover { background: #fdf0f8; }
    .cal-num  { font-size: 16px; font-weight: 900; line-height: 1; }
    .cal-csat { font-size: 10px; font-weight: 700; opacity: .8; margin-top: 2px; letter-spacing: .3px; }

    /* LEGENDA */
    .legenda {
      display: flex; align-items: center; gap: 16px; margin-top: 12px;
      font-size: 11px; color: var(--muted);
    }
    .legenda-item { display: flex; align-items: center; gap: 5px; }
    .legenda-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

    /* VAZIO */
    .empty-state { text-align: center; padding: 60px; color: var(--muted); }

    /* FOOTER */
    .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--borda); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .footer-brand { font-weight: 900; font-size: 14px; color: var(--preto); }
    .footer-brand b { color: var(--rosa); }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">INK<b>.</b></div>
    <div class="sep"></div>
    <div class="hdr-meta">
      <h1>Painel de CSAT — Avaliações</h1>
      <p>Histórico diário · Atualizado automaticamente todo dia útil às 7h</p>
    </div>
    <a class="btn-gestao" href="gerencial.html">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17.5h7M17.5 14v7"/></svg>
      Painel de Gestão
    </a>
  </div>
</header>

<main class="main">

  <div class="filtro-bar">
    <span class="filtro-bar-label">Filtrar período</span>
    <div class="filtro-bar-inputs">
      <label>De <input type="date" id="dt-inicio" /></label>
      <label>Até <input type="date" id="dt-fim" /></label>
      <button class="btn-filtrar" onclick="verPeriodo()">Ver período</button>
      <button class="btn-limpar" id="btn-limpar" onclick="limparFiltro()">✕ Limpar</button>
    </div>
  </div>

  <div id="periodo-res"></div>

  <div id="conteudo">
    <div class="loading">
      <div style="margin-bottom:12px">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      </div>
      Carregando histórico...
    </div>
  </div>

  <div class="footer">
    <span class="footer-brand">INK<b>.</b></span>
    <span>Dados atualizados todo dia útil às 7h</span>
  </div>
</main>

<script>
  const API = 'https://csat-negativo-78f436cca6a0.herokuapp.com';

  const MESES_PT   = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const MESES_ABREV = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const DIAS_SEMANA = ['Seg','Ter','Qua','Qui','Sex'];

  let totaisMap = {}, avaliadosMap = {};

  function volClass(total) {
    if (total >= 8) return 'vol-alto';
    if (total >= 4) return 'vol-medio';
    return 'vol-baixo';
  }

  async function init() {
    const el = document.getElementById('conteudo');
    try {
      const resp = await fetch(`${API}/summary`);
      const resumo = await resp.json();

      if (!resumo || resumo.length === 0) {
        el.innerHTML = `<div class="empty-state"><strong>Nenhum relatório disponível ainda.</strong></div>`;
        return;
      }

      resumo.forEach(r => {
        totaisMap[r.date] = r.total;
        if (r.total_avaliados) avaliadosMap[r.date] = { avaliados: r.total_avaliados, positivos: r.total_positivos || 0, negativos: r.total };
      });

      // define datas padrão do filtro (mês atual)
      const hoje = new Date();
      const anoAtual = hoje.getFullYear();
      const mesAtual = String(hoje.getMonth() + 1).padStart(2, '0');
      document.getElementById('dt-inicio').value = `${anoAtual}-${mesAtual}-01`;
      document.getElementById('dt-fim').value = hoje.toISOString().slice(0, 10);

      const grupos = {};
      resumo.forEach(r => {
        const chave = r.date.slice(0, 7);
        if (!grupos[chave]) grupos[chave] = [];
        grupos[chave].push(r.date);
      });

      let html = '';
      for (const [mesAno] of Object.entries(grupos).sort((a, b) => b[0].localeCompare(a[0]))) {
        const [ano, mes] = mesAno.split('-').map(Number);
        html += `
          <div class="month-section">
            <div class="month-title">${MESES_PT[mes - 1]} ${ano}</div>
            ${renderCalendario(ano, mes, totaisMap)}
            <div class="legenda">
              <span>Satisfação:</span>
              <span class="legenda-item"><span class="legenda-dot" style="background:#fff;border:2px solid #e91e8c;box-sizing:border-box"></span> Alta (≥75%)</span>
              <span class="legenda-item"><span class="legenda-dot" style="background:#e91e8c"></span> Média (55–74%)</span>
              <span class="legenda-item"><span class="legenda-dot" style="background:#9d1366"></span> Baixa (&lt;55%)</span>
            </div>
          </div>`;
      }

      el.innerHTML = html;

    } catch(e) {
      el.innerHTML = `<div class="empty-state"><strong>Erro ao carregar dados.</strong><br>${e.message}</div>`;
    }
  }

  function verPeriodo() {
    const de  = document.getElementById('dt-inicio').value;
    const ate = document.getElementById('dt-fim').value;
    if (!de || !ate) return;

    const datas = Object.keys(totaisMap).filter(d => d >= de && d <= ate).sort();
    const el    = document.getElementById('periodo-res');

    if (!datas.length) {
      el.innerHTML = `<div class="periodo-panel"><div class="periodo-head"><span class="periodo-titulo">Nenhum dado nesse período</span></div></div>`;
      document.getElementById('btn-limpar').style.display = 'inline-flex';
      return;
    }

    const total   = datas.reduce((s, d) => s + (totaisMap[d] || 0), 0);
    const media   = (total / datas.length).toFixed(1);
    const deFmt   = formatDataBr(de);
    const ateFmt  = formatDataBr(ate);

    const diasHtml = datas.map(d => {
      const cnt = totaisMap[d] || 0;
      const dia = Number(d.slice(8));
      const mes = MESES_ABREV[Number(d.slice(5, 7)) - 1];
      return `<a class="periodo-dia ${volClass(cnt)}" href="report.html?date=${d}">
        <span class="periodo-dia-data">${dia}/${mes}</span>
        <span class="periodo-dia-cnt">${cnt} neg</span>
      </a>`;
    }).join('');

    el.innerHTML = `
      <div class="periodo-panel">
        <div class="periodo-head">
          <span class="periodo-titulo">${deFmt} → ${ateFmt}</span>
          <div class="periodo-stats">
            <div class="periodo-stat"><div class="periodo-stat-val">${total}</div><div class="periodo-stat-lbl">negativos</div></div>
            <div class="periodo-stat"><div class="periodo-stat-val">${datas.length}</div><div class="periodo-stat-lbl">dias</div></div>
            <div class="periodo-stat"><div class="periodo-stat-val">${media}</div><div class="periodo-stat-lbl">média/dia</div></div>
          </div>
        </div>
        <div class="periodo-dias-list">${diasHtml}</div>
      </div>`;

    document.getElementById('btn-limpar').style.display = 'inline-flex';
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function limparFiltro() {
    document.getElementById('periodo-res').innerHTML = '';
    document.getElementById('btn-limpar').style.display = 'none';
  }

  function formatDataBr(iso) {
    const [, mes, dia] = iso.split('-');
    return `${Number(dia)}/${MESES_ABREV[Number(mes) - 1]}`;
  }

  function renderCalendario(ano, mes, totaisMap) {
    const totalDias  = new Date(ano, mes, 0).getDate();
    const diaSemana1 = new Date(ano, mes - 1, 1).getDay();
    const offsetMap  = { 1:0, 2:1, 3:2, 4:3, 5:4, 6:0, 0:0 };
    const offset     = offsetMap[diaSemana1];

    let cells = '';
    for (let i = 0; i < offset; i++) cells += `<div class="cal-cell empty"></div>`;

    for (let dia = 1; dia <= totalDias; dia++) {
      const dow = new Date(ano, mes - 1, dia).getDay();
      if (dow === 0 || dow === 6) continue;

      const dataStr = `${ano}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
      const total   = totaisMap[dataStr];

      if (total !== undefined) {
        const av = avaliadosMap[dataStr];
        let vc, label;
        if (av && av.avaliados > 0) {
          const pct = Math.round(av.positivos / av.avaliados * 100);
          vc = pct >= 75 ? 'vol-baixo' : pct >= 55 ? 'vol-medio' : 'vol-alto';
          label = `${av.avaliados} av`;
        } else {
          vc = volClass(total);
          label = `${total} neg`;
        }
        cells += `
          <div class="cal-cell">
            <a class="cal-day tem-dados ${vc}" href="report.html?date=${dataStr}">
              <span class="cal-num">${dia}</span>
              <span class="cal-csat">${label}</span>
            </a>
          </div>`;
      } else {
        cells += `
          <div class="cal-cell">
            <div class="cal-day"><span class="cal-num">${dia}</span></div>
          </div>`;
      }
    }

    return `
      <div class="calendar">
        <div class="cal-header">${DIAS_SEMANA.map(d => `<span>${d}</span>`).join('')}</div>
        <div class="cal-grid">${cells}</div>
      </div>`;
  }

  init();
</script>
</body>
</html>

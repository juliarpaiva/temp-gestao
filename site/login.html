<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — CSAT INK</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f8f9fb;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 32px rgba(0,0,0,.10);
    padding: 48px 40px 40px;
    width: 100%;
    max-width: 380px;
  }
  .logo { font-size: 22px; font-weight: 900; letter-spacing: -1px; color: #0f0f0f; margin-bottom: 6px; }
  .logo b { color: #e91e8c; }
  .subtitle { font-size: 12px; color: #94a3b8; font-weight: 500; margin-bottom: 36px; }
  label { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .pw-wrap { position: relative; margin-bottom: 18px; }
  .pw-wrap input { margin-bottom: 0; padding-right: 42px; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%; border: 1.5px solid #e2e8f0; border-radius: 8px;
    padding: 10px 14px; font-size: 14px; color: #0f0f0f; outline: none;
    transition: border-color .15s; font-family: inherit;
  }
  input[type="email"] { margin-bottom: 18px; }
  input:focus { border-color: #e91e8c; }
  .eye-btn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 4px;
    color: #94a3b8; display: flex; align-items: center;
  }
  .eye-btn:hover { color: #475569; }
  .btn {
    width: 100%; background: #e91e8c; color: #fff; border: none; border-radius: 8px;
    padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: background .15s; font-family: inherit; margin-top: 4px;
  }
  .btn:hover { background: #c2185b; }
  .erro { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; border-radius: 8px; padding: 10px 14px; font-size: 12px; font-weight: 600; margin-bottom: 20px; display: none; }
  .erro.visivel { display: block; }
  .divider { border: none; border-top: 1px solid #f1f5f9; margin: 28px 0 0; }
  .footer-hint { font-size: 11px; color: #cbd5e1; text-align: center; margin-top: 16px; }
  .forgot { display: block; text-align: center; margin-top: 14px; font-size: 12px; color: #94a3b8; text-decoration: none; }
  .forgot:hover { color: #e91e8c; }
  .msg-sucesso { background: #f0fdf4; border: 1px solid #86efac; color: #15803d; border-radius: 8px; padding: 10px 14px; font-size: 12px; font-weight: 600; margin-bottom: 20px; display: none; }
  .btn-novo {
    display: block; width: 100%; background: #fff; color: #e91e8c;
    border: 1.5px solid #e91e8c; border-radius: 8px; padding: 11px; font-size: 14px;
    font-weight: 700; cursor: pointer; text-align: center; text-decoration: none;
    font-family: inherit; margin-top: 10px; transition: background .15s, color .15s;
  }
  .btn-novo:hover { background: #fce7f3; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">INK<b>.</b></div>
  <div class="subtitle">Painel de Gestão — CSAT</div>

  <div class="msg-sucesso" id="sucesso-msg" style="display:none"></div>
  <div class="erro" id="erro-msg">Opa, verifique se não está faltando algo.</div>

  <form method="POST" action="/login">
    <input type="hidden" name="redirect" id="redirect-field" value="/">
    <div>
      <label for="email">E-mail corporativo</label>
      <input type="email" id="email" name="email" placeholder="voce@reserva.ink" autocomplete="email" required>
    </div>
    <div>
      <label for="password">Senha</label>
      <div class="pw-wrap">
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="eye-btn" onclick="toggleSenha('password', this)" tabindex="-1" aria-label="Mostrar senha">
          <svg id="eye-login" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn">Entrar</button>
  </form>
  <a href="/forgot-password" class="forgot">Esqueci minha senha</a>
  <a href="/register" class="btn-novo">Criar senha de acesso</a>

  <hr class="divider">
  <p class="footer-hint">Problemas para acessar? Entre em contato com o suporte. ⭐</p>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const msg = document.getElementById('sucesso-msg');
  if (params.get('erro'))     document.getElementById('erro-msg').classList.add('visivel');
  if (params.get('senha'))   { msg.textContent = 'Senha atualizada! Faça login.'; msg.style.display = 'block'; }
  if (params.get('cadastro')){ msg.textContent = 'Conta criada com sucesso! Faça login.'; msg.style.display = 'block'; }
  if (params.get('r'))        document.getElementById('redirect-field').value = params.get('r');

  function toggleSenha(inputId, btn) {
    const inp = document.getElementById(inputId);
    const showing = inp.type === 'text';
    inp.type = showing ? 'password' : 'text';
    btn.querySelector('svg').style.opacity = showing ? '1' : '0.4';
  }
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — CSAT INK</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f8f9fb;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 32px rgba(0,0,0,.10);
    padding: 48px 40px 40px;
    width: 100%;
    max-width: 380px;
  }
  .logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -1px;
    color: #0f0f0f;
    margin-bottom: 6px;
  }
  .logo b { color: #e91e8c; }
  .subtitle {
    font-size: 12px;
    color: #94a3b8;
    font-weight: 500;
    margin-bottom: 36px;
  }
  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
  }
  input[type="email"], input[type="password"] {
    width: 100%;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    color: #0f0f0f;
    outline: none;
    transition: border-color .15s;
    margin-bottom: 18px;
    font-family: inherit;
  }
  input:focus { border-color: #e91e8c; }
  .btn {
    width: 100%;
    background: #e91e8c;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s;
    font-family: inherit;
    margin-top: 4px;
  }
  .btn:hover { background: #c2185b; }
  .erro {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 20px;
    display: none;
  }
  .erro.visivel { display: block; }
  .divider {
    border: none;
    border-top: 1px solid #f1f5f9;
    margin: 28px 0 0;
  }
  .footer-hint {
    font-size: 11px;
    color: #cbd5e1;
    text-align: center;
    margin-top: 16px;
  }
  .forgot {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
    color: #94a3b8;
    text-decoration: none;
  }
  .forgot:hover { color: #e91e8c; }
  .msg-sucesso {
    background: #f0fdf4;
    border: 1px solid #86efac;
    color: #15803d;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 20px;
    display: none;
  }
  .msg-sucesso.visivel { display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">INK<b>.</b></div>
  <div class="subtitle">Painel de Gestão — CSAT · Acesso restrito</div>

  <div class="msg-sucesso" id="sucesso-msg">Senha atualizada com sucesso! Faça login.</div>
  <div class="erro" id="erro-msg">E-mail ou senha incorretos.</div>

  <form method="POST" action="/login">
    <input type="hidden" name="redirect" id="redirect-field" value="/">
    <div>
      <label for="email">E-mail corporativo</label>
      <input type="email" id="email" name="email" placeholder="voce@reserva.ink" autocomplete="email" required>
    </div>
    <div>
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Entrar</button>
  </form>
  <a href="/forgot-password" class="forgot">Esqueci minha senha</a>

  <hr class="divider">
  <p class="footer-hint">Problemas? Fale com a Julia.</p>
</div>

<script>
  const params = new URLSearchParams(location.search);
  if (params.get('erro'))   document.getElementById('erro-msg').classList.add('visivel');
  if (params.get('senha'))  document.getElementById('sucesso-msg').classList.add('visivel');
  if (params.get('r'))      document.getElementById('redirect-field').value = params.get('r');
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova senha — CSAT INK</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f8f9fb;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 32px rgba(0,0,0,.10);
    padding: 48px 40px 40px;
    width: 100%;
    max-width: 380px;
  }
  .logo { font-size: 22px; font-weight: 900; letter-spacing: -1px; color: #0f0f0f; margin-bottom: 6px; }
  .logo b { color: #e91e8c; }
  .subtitle { font-size: 12px; color: #94a3b8; font-weight: 500; margin-bottom: 28px; }
  label { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  input[type="password"] {
    width: 100%; border: 1.5px solid #e2e8f0; border-radius: 8px;
    padding: 10px 14px; font-size: 14px; color: #0f0f0f; outline: none;
    transition: border-color .15s; margin-bottom: 18px; font-family: inherit;
  }
  input:focus { border-color: #e91e8c; }
  .btn {
    width: 100%; background: #e91e8c; color: #fff; border: none; border-radius: 8px;
    padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: background .15s; font-family: inherit; margin-top: 4px;
  }
  .btn:hover { background: #c2185b; }
  .msg {
    border-radius: 8px; padding: 12px 14px; font-size: 13px; font-weight: 600;
    margin-bottom: 20px; display: none;
  }
  .msg.erro     { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
  .msg.expirado { background: #fff7ed; border: 1px solid #fed7aa; color: #c2410c; }
  .hint { font-size: 11px; color: #94a3b8; margin-top: -12px; margin-bottom: 18px; }
  hr { border: none; border-top: 1px solid #f1f5f9; margin: 28px 0 0; }
  .footer-hint { font-size: 11px; color: #cbd5e1; text-align: center; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">INK<b>.</b></div>
  <div class="subtitle">Criar nova senha</div>

  <div class="msg erro"     id="msg-erro">As senhas não coincidem ou são inválidas.</div>
  <div class="msg erro"     id="msg-curta">A senha precisa ter pelo menos 6 caracteres.</div>
  <div class="msg expirado" id="msg-expirado">Este link expirou ou já foi utilizado. <a href="/forgot-password" style="color:#c2410c">Solicite um novo.</a></div>

  <form method="POST" action="/reset-password" id="form-reset">
    <input type="hidden" name="token" id="token-field">
    <div>
      <label for="password">Nova senha</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required>
    </div>
    <p class="hint">Mínimo 6 caracteres</p>
    <div>
      <label for="confirm">Confirmar senha</label>
      <input type="password" id="confirm" name="confirm" placeholder="••••••••" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn">Salvar senha</button>
  </form>

  <hr>
  <p class="footer-hint">Problemas? Fale com a Julia.</p>
</div>

<script>
  const p = new URLSearchParams(location.search);
  const token = p.get('token') || '';
  document.getElementById('token-field').value = token;

  if (!token || p.get('erro') === 'expirado') {
    document.getElementById('msg-expirado').style.display = 'block';
    document.getElementById('form-reset').style.display = 'none';
  } else if (p.get('erro') === 'curta') {
    document.getElementById('msg-curta').style.display = 'block';
  } else if (p.get('erro')) {
    document.getElementById('msg-erro').style.display = 'block';
  }
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova senha — CSAT INK</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f8f9fb; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 32px rgba(0,0,0,.10); padding: 48px 40px 40px; width: 100%; max-width: 380px; }
  .logo { font-size: 22px; font-weight: 900; letter-spacing: -1px; color: #0f0f0f; margin-bottom: 6px; }
  .logo b { color: #e91e8c; }
  .subtitle { font-size: 12px; color: #94a3b8; font-weight: 500; margin-bottom: 28px; }
  label { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  input[type="password"], input[type="text"] {
    width: 100%; border: 1.5px solid #e2e8f0; border-radius: 8px;
    padding: 10px 14px; font-size: 14px; color: #0f0f0f; outline: none;
    transition: border-color .15s; font-family: inherit;
  }
  input:focus { border-color: #e91e8c; }
  .pw-wrap { position: relative; margin-bottom: 8px; }
  .pw-wrap input { padding-right: 42px; }
  .eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px; color: #94a3b8; display: flex; align-items: center; }
  .eye-btn:hover { color: #475569; }
  .reqs { background: #f8f9fb; border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; }
  .req { font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 6px; padding: 2px 0; transition: color .2s; }
  .req.ok  { color: #16a34a; }
  .req.bad { color: #ef4444; }
  .req .dot { font-size: 14px; font-weight: 700; width: 14px; text-align: center; }
  .btn { width: 100%; background: #e91e8c; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s; font-family: inherit; margin-top: 4px; }
  .btn:hover { background: #c2185b; }
  .btn:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
  .msg { border-radius: 8px; padding: 12px 14px; font-size: 13px; font-weight: 600; margin-bottom: 20px; display: none; }
  .msg.erro     { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
  .msg.expirado { background: #fff7ed; border: 1px solid #fed7aa; color: #c2410c; }
  hr { border: none; border-top: 1px solid #f1f5f9; margin: 28px 0 0; }
  .footer-hint { font-size: 11px; color: #cbd5e1; text-align: center; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">INK<b>.</b></div>
  <div class="subtitle">Criar nova senha</div>

  <div class="msg erro"     id="msg-erro">As senhas não coincidem ou são inválidas.</div>
  <div class="msg erro"     id="msg-curta">A senha não atende aos requisitos mínimos.</div>
  <div class="msg expirado" id="msg-expirado">Este link expirou ou já foi utilizado. <a href="/forgot-password" style="color:#c2410c">Solicite um novo.</a></div>

  <form method="POST" action="/reset-password" id="form-reset" novalidate>
    <input type="hidden" name="token" id="token-field">
    <div style="margin-bottom:8px">
      <label for="password">Nova senha</label>
      <div class="pw-wrap">
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" oninput="validar()" required>
        <button type="button" class="eye-btn" onclick="toggleSenha('password',this)" tabindex="-1"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <div class="reqs" id="reqs">
      <div class="req" id="req-len"><span class="dot">·</span> Mínimo 8 caracteres</div>
      <div class="req" id="req-num"><span class="dot">·</span> Ao menos 1 número</div>
      <div class="req" id="req-esp"><span class="dot">·</span> Ao menos 1 caractere especial</div>
    </div>
    <div style="margin-bottom:18px">
      <label for="confirm">Confirmar senha</label>
      <div class="pw-wrap">
        <input type="password" id="confirm" name="confirm" placeholder="••••••••" autocomplete="new-password" oninput="validar()" required>
        <button type="button" class="eye-btn" onclick="toggleSenha('confirm',this)" tabindex="-1"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <button type="submit" class="btn" id="btn-salvar" disabled>Salvar senha</button>
  </form>

  <hr>
  <p class="footer-hint">Problemas para acessar? Entre em contato com o suporte. ⭐</p>
</div>

<script>
  const p = new URLSearchParams(location.search);
  const token = p.get('token') || '';
  document.getElementById('token-field').value = token;

  if (!token || p.get('erro') === 'expirado') {
    document.getElementById('msg-expirado').style.display = 'block';
    document.getElementById('form-reset').style.display = 'none';
  } else if (p.get('erro') === 'curta') {
    document.getElementById('msg-curta').style.display = 'block';
  } else if (p.get('erro')) {
    document.getElementById('msg-erro').style.display = 'block';
  }

  function toggleSenha(id, btn) {
    const inp = document.getElementById(id);
    const showing = inp.type === 'text';
    inp.type = showing ? 'password' : 'text';
    btn.style.opacity = showing ? '1' : '0.4';
  }

  function setReq(id, ok, touched) {
    const el = document.getElementById(id);
    el.classList.toggle('ok', ok);
    el.classList.toggle('bad', !ok && touched);
    el.querySelector('.dot').textContent = ok ? '✓' : (touched ? '✗' : '·');
  }

  function validar() {
    const pw = document.getElementById('password').value;
    const cf = document.getElementById('confirm').value;
    const touched = pw.length > 0;
    const lenOk = pw.length >= 8, numOk = /\d/.test(pw), espOk = /[^a-zA-Z0-9]/.test(pw);
    setReq('req-len', lenOk, touched);
    setReq('req-num', numOk, touched);
    setReq('req-esp', espOk, touched);
    const ok = lenOk && numOk && espOk && cf.length > 0 && pw === cf;
    document.getElementById('btn-salvar').disabled = !ok;
    document.getElementById('btn-salvar').style.opacity = ok ? '1' : '0.5';
  }
</script>
</body>
</html>
